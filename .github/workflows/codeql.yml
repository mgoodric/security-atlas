name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Slice 415 — `Analyze (go)` and `Analyze (javascript-typescript)` are
  # BOTH in `.github/branch-protection.json`'s
  # `required_status_checks.contexts`. GitHub's merge queue evaluates the
  # required checks on the merge-group commit, so without this trigger the
  # two CodeQL contexts would never report on a `merge_group` event and
  # every queue entry would sit pending until the check-response timeout
  # evicted it — the queue would be wedged from the moment it is enabled.
  # This adds no check to and removes none from the required set (slice
  # 415 P0-1); it only lets the existing required checks report on the new
  # event. See docs/ci/MERGE_QUEUE.md.
  merge_group:
  schedule:
    # Weekly, Monday 09:00 UTC
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  # Slice 415: same rule as ci.yml — never cancel a `merge_group` run. A
  # cancelled queue run reports its required checks as `cancelled`, which
  # the merge queue treats as a failure and evicts the entry on.
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          # Python scanning intentionally omitted while the repo has no
          # Python source. oscal-bridge (planned per CLAUDE.md tech stack)
          # is the only Python surface and hasn't shipped yet; the slice
          # that lands it should re-add `- language: python, build-mode: none`
          # to this matrix. CodeQL's Python extractor errors on
          # zero-modules-extracted, so omitting the language is cleaner
          # than configuring a no-op build step.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Autobuild (Go)
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: "/language:${{ matrix.language }}"
