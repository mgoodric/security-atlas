    rationale: "Slice 567 HOLD — final, no dependency on a larger catalog. Requirements for Group Health Plans (plan documents must require the plan sponsor to safeguard ePHI) is a plan-document amendment obligation on a HIPAA-specific regulatory relationship, not a security control; there is no SCF analog to find. TPM-01 as covering anchor at a deliberately low 0.55 is the honest mapping. See decisions log D6 row 15."
