  # ===== TECHNICAL SAFEGUARDS (§164.312) → SCF =====
  # 164.312(a)(1) → IAC-01 is the FIVE-FRAMEWORK shared anchor (invariant #1, AC-4).
  - requirement_code: "164.312(a)(1)"
    scf_anchor: "IAC-01"
    relationship_type: "equal"
    strength: 0.9
    rationale: "Technical Access Control (only authorized persons/programs access ePHI) maps directly to SCF Identification & Authentication Policy (five-framework shared anchor)."
  - requirement_code: "164.312(a)(2)(i)"
    scf_anchor: "IAC-07"
    relationship_type: "intersects_with"
    strength: 0.75
    rationale: "Unique User Identification strongly overlaps SCF User Provisioning & Lifecycle (unique identity is a provisioning outcome)."
  - requirement_code: "164.312(a)(2)(ii)"
    scf_anchor: "IAC-24"
    relationship_type: "equal"
    strength: 0.8
    rationale: "Slice 567 re-point (was IAC-21 @ 0.60). Emergency Access Procedure (procedures for obtaining necessary ePHI during an emergency) IS the break-glass control; privileged-account management was the covering anchor only because no break-glass anchor existed. IAC-24 Emergency Access (Break-Glass) Accounts is the direct equivalent. Lift 0.60 -> 0.80 (LOW -> MEDIUM). See decisions log D6 row 9."
  - requirement_code: "164.312(a)(2)(iii)"
    scf_anchor: "IAC-25"
    relationship_type: "equal"
    strength: 0.85
    rationale: "Slice 567 re-point (was IAC-01 @ 0.60). Automatic Logoff (electronic procedures that terminate an electronic session after a predetermined time of inactivity) IS session termination; IAC-01, the domain policy head, badly over-covered it. IAC-25 Session Termination is the direct equivalent. Lift 0.60 -> 0.85 (LOW -> HIGH). See decisions log D6 row 10."
  - requirement_code: "164.312(a)(2)(iv)"
    scf_anchor: "CRY-04"
    relationship_type: "equal"
    strength: 0.85
    rationale: "Encryption and Decryption of ePHI at rest maps directly to SCF Encryption At Rest."
  - requirement_code: "164.312(b)"
    scf_anchor: "AAA-01"
    relationship_type: "equal"
    strength: 0.9
    rationale: "Audit Controls (record and examine system activity) map directly to SCF Auditing & Accountability."
  - requirement_code: "164.312(c)(1)"
    scf_anchor: "DCH-05"
    relationship_type: "subset_of"
    strength: 0.8
    rationale: "Slice 567 re-point (was DCH-01 @ 0.65; the palette-bound row slice 481 D7 flagged and slice 516 D5 held). Integrity (protect ePHI from improper alteration or destruction) is a data-integrity control, not a classification-and-handling one; DCH-01 was the covering anchor only because no integrity anchor existed. DCH-05 Data Integrity is the policy-level integrity anchor; 164.312(c)(2) carries the cryptographic mechanism that implements it. Lift 0.65 -> 0.80 (LOW -> MEDIUM). See decisions log D6 row 11."
  - requirement_code: "164.312(c)(2)"
    scf_anchor: "CRY-11"
    relationship_type: "subset_of"
    strength: 0.8
    rationale: "Slice 567 re-point (was DCH-01 @ 0.60). Mechanism to Authenticate ePHI (electronic mechanisms to corroborate that ePHI has not been altered or destroyed in an unauthorized manner) is the cryptographic verification mechanism — hashing, digital signatures — that implements 164.312(c)(1)'s integrity obligation. CRY-11 Cryptographic Integrity Verification keeps the mechanism distinct from the policy-level DCH-05 anchor rather than collapsing both onto one row. Lift 0.60 -> 0.80 (LOW -> MEDIUM). See decisions log D6 row 12."
  - requirement_code: "164.312(d)"
    scf_anchor: "IAC-01"
    relationship_type: "subset_of"
    strength: 0.8
    rationale: "Person or Entity Authentication (verify claimed identity) is covered by SCF Identification & Authentication Policy."
  - requirement_code: "164.312(e)(1)"
    scf_anchor: "NET-04"
    relationship_type: "intersects_with"
    strength: 0.7
    rationale: "Transmission Security (guard against unauthorized access to ePHI in transit) overlaps SCF Boundary Protection; the cryptographic facet sits in 164.312(e)(2)(ii) (MEDIUM)."
  - requirement_code: "164.312(e)(2)(i)"
    scf_anchor: "CRY-12"
    relationship_type: "subset_of"
    strength: 0.85
    rationale: "Slice 567 re-point (was NET-04 @ 0.60). Integrity Controls (Transmission) requires that transmitted ePHI is not improperly modified without detection — modification DETECTION in transit, not perimeter enforcement. Boundary protection answered a different question. CRY-12 Transmission Integrity is the on-point anchor. Lift 0.60 -> 0.85 (LOW -> HIGH). See decisions log D6 row 13."
  - requirement_code: "164.312(e)(2)(ii)"
    scf_anchor: "CRY-08"
    relationship_type: "equal"
    strength: 0.85
    rationale: "Encryption (Transmission) maps directly to SCF Encryption In Transit."

