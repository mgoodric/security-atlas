    scf_anchor: "BCD-02"
    relationship_type: "intersects_with"
    strength: 0.6
    rationale: "Slice 567 LEFT AS-IS (checked against the grown palette, not re-pointed). Contingency Operations (facility access supporting data restoration in an emergency) genuinely straddles continuity and physical access, and neither family carries a control at that intersection worth minting: an emergency-facility-access anchor would exist only to serve this one row. BCD-02 remains the honest covering anchor at 0.60 (LOW). See decisions log D6 row 5."
  - requirement_code: "164.310(a)(2)(ii)"
    scf_anchor: "PES-04"
    relationship_type: "subset_of"
    strength: 0.75
    rationale: "Facility Security Plan (safeguard facility/equipment from unauthorized access, tampering, theft) is the planning facet of SCF Physical Access Control."
  - requirement_code: "164.310(a)(2)(iii)"
    scf_anchor: "PES-04"
    relationship_type: "subset_of"
    strength: 0.8
    rationale: "Access Control and Validation Procedures (control/validate person access by role, visitor control) are covered by SCF Physical Access Control."
  - requirement_code: "164.310(a)(2)(iv)"
    scf_anchor: "MNT-02"
    relationship_type: "intersects_with"
    strength: 0.7
    rationale: "Slice 567 re-point (was PES-04 @ 0.55). Maintenance Records (document repairs and modifications to the physical components of a facility which are related to security) is maintenance record-keeping, not physical access control; MNT-02 Controlled Maintenance carries the record-retention obligation. The fit stays partial because HIPAA scopes it to security-related facility components. Lift 0.55 -> 0.70 (LOW -> MEDIUM). See decisions log D6 row 6."
  - requirement_code: "164.310(b)"
    scf_anchor: "HRS-12"
    relationship_type: "intersects_with"
