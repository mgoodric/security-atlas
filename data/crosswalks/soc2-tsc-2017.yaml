requirements:
  # Common Criteria — Control Environment (CC1)
  - code: CC1.1
    title: "COSO Principle 1: Integrity and ethics"
    body: "Leadership sets and upholds expected standards of conduct, and departures from them are found and dealt with."
  - code: CC1.2
    title: "COSO Principle 2: Board oversight"
    body: "A governing body that is independent of management supervises how internal control is designed and run."
  - code: CC1.3
    title: "COSO Principle 3: Structure and authority"
    body: "Reporting lines, decision rights, and duties for internal control are set out, under the governing body's supervision."
  - code: CC1.4
    title: "COSO Principle 4: Competent people"
    body: "The organization hires, trains, and keeps staff with the skills their control duties need."
  - code: CC1.5
    title: "COSO Principle 5: Accountability"
    body: "People answer for the control duties assigned to them, with performance measures and consequences to back that up."

  # Common Criteria — Communication & Information (CC2)
  - code: CC2.1
    title: "Quality information"
    body: "Accurate, timely, relevant information is gathered or produced and used to run the control system."
  - code: CC2.2
    title: "Internal communication"
    body: "Control objectives, responsibilities, and concerns are shared with the staff who need them, including a channel to raise issues."
  - code: CC2.3
    title: "External communication"
    body: "Customers, regulators, vendors, and other outside parties are told about, and can report, matters that bear on control."

  # Common Criteria — Risk Assessment (CC3)
  - code: CC3.1
    title: "Clear objectives"
    body: "Business objectives are stated precisely enough that the risks to them can be found and weighed."
  - code: CC3.2
    title: "Risk identification and analysis"
    body: "Risks to objectives are identified across the organization and analysed to decide how each is handled."
  - code: CC3.3
    title: "Fraud risk"
    body: "The risk assessment covers the chance of fraud, including incentives, opportunity, and management override."
  - code: CC3.4
    title: "Significant change"
    body: "Internal or external changes that could materially affect controls are spotted and assessed."

  # Common Criteria — Monitoring (CC4)
  - code: CC4.1
    title: "Control evaluations"
    body: "Continuous and periodic checks confirm that each part of the control system exists and works."
  - code: CC4.2
    title: "Deficiency reporting"
    body: "Control weaknesses found are assessed and promptly reported to whoever must fix them, including senior management where warranted."

  # Common Criteria — Control Activities (CC5)
  - code: CC5.1
    title: "Control activity selection"
    body: "Controls are chosen and built so that risks to objectives fall to a tolerable level."
  - code: CC5.2
    title: "Technology general controls"
    body: "General IT controls (infrastructure, security management, acquisition and maintenance) are chosen and built to support objectives."
  - code: CC5.3
    title: "Policies and procedures"
    body: "Controls are put into practice through written policies stating expectations and procedures that carry them out."

  # Common Criteria — Logical & Physical Access (CC6)
  - code: CC6.1
    title: "Logical access controls"
    body: "Software, infrastructure, and architecture restrict logical access to protected information assets."
  - code: CC6.2
    title: "User registration"
    body: "Internal and external users are registered and approved before they receive credentials."
  - code: CC6.3
    title: "Access changes"
    body: "Granting, changing, and revoking access to data and systems follows an approval process, guided by least privilege and separation of duties."
  - code: CC6.4
    title: "Physical access"
    body: "Entry to facilities, data centres, and media holding protected assets is limited to approved people."
  - code: CC6.5
    title: "Asset disposal"
    body: "Protections on hardware and media stay in place until the data on them can no longer be read or recovered."
  - code: CC6.6
    title: "External threat protection"
    body: "Boundary controls guard the system against threats coming from outside it."
  - code: CC6.7
    title: "Data transmission and movement"
    body: "Sending, moving, or taking information out of the system is confined to approved users and processes, and protected in transit."
  - code: CC6.8
    title: "Malicious software"
    body: "Unauthorized or harmful software is blocked or detected, and acted on when found."

  # Common Criteria — System Operations (CC7)
  - code: CC7.1
    title: "Configuration and vulnerability detection"
    body: "Configuration changes and newly exposed weaknesses are detected through monitoring and scanning."
  - code: CC7.2
    title: "Anomaly monitoring"
    body: "System components and their behaviour are watched for signs of attack, failure, or other abnormal activity."
  - code: CC7.3
    title: "Security event evaluation"
    body: "Detected security events are triaged to decide whether they amount to an incident that threatens objectives."
  - code: CC7.4
    title: "Incident response"
    body: "Confirmed incidents are contained and remediated under a documented response plan with assigned roles."
  - code: CC7.5
    title: "Incident recovery"
    body: "Recovery from incidents is planned and carried out, and lessons learned feed back into controls."

  # Common Criteria — Change Management (CC8)
  - code: CC8.1
    title: "Change management"
    body: "Changes to infrastructure, data, software, and procedures go through a controlled path: approval, design, testing, documentation, and release."

  # Common Criteria — Risk Mitigation (CC9)
  - code: CC9.1
    title: "Business disruption risk"
    body: "Mitigations, including insurance and continuity measures, are chosen for risks of business interruption."
  - code: CC9.2
    title: "Vendor and partner risk"
    body: "Risks from vendors and business partners are assessed and managed through their lifecycle."

  # Availability (A1)
  - code: A1.1
    title: "Capacity management"
    body: "Processing capacity and usage are tracked and forecast so demand can be met and capacity added when needed."
  - code: A1.2
    title: "Environmental protection, backup, and recovery infrastructure"
    body: "Environmental safeguards, backups, and recovery infrastructure are put in place, run, and monitored to keep the system available."
  - code: A1.3
    title: "Recovery testing"
    body: "Recovery plans are exercised periodically to show the system can be restored."

  # Confidentiality (C1)
  - code: C1.1
    title: "Confidential information handling"
    body: "Information designated confidential is identified and protected while it is held."
  - code: C1.2
    title: "Confidential information disposal"
    body: "Confidential information is securely destroyed once it is no longer needed."

  # Processing Integrity (PI1)
  - code: PI1.1
    title: "Processing specifications"
    body: "Each service publishes what data it handles and how it is meant to behave, so customers know what to expect from it."
  - code: PI1.2
    title: "Input controls"
    body: "Inputs to the system are checked for completeness and accuracy."
  - code: PI1.3
    title: "Processing controls"
    body: "Processing is checked so that results are complete, accurate, valid, timely, and authorized."
  - code: PI1.4
    title: "Output controls"
    body: "Outputs reach the intended recipients complete, accurate, and on time, as specified."
  - code: PI1.5
    title: "Storage controls"
    body: "Inputs, work in progress, and outputs are stored completely and accurately, as specified."

