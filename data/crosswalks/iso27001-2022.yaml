requirements:
  # ===== A.5 Organizational controls =====
  - code: A.5.1
    title: "Policies for information security"
    body: "Management approves a top-level security policy plus subject policies, shares them with staff and revisits them on a schedule."
  - code: A.5.2
    title: "Information security roles and responsibilities"
    body: "Every security duty has a named owner, sized to what the organization actually needs."
  - code: A.5.3
    title: "Segregation of duties"
    body: "No single person can both make and approve a sensitive change, so one person's mistake or misuse is caught."
  - code: A.5.4
    title: "Management responsibilities"
    body: "Managers expect their teams to follow security policy and hold them to it."
  - code: A.5.5
    title: "Contact with authorities"
    body: "Contacts with regulators, law enforcement and other authorities are known and kept current."
  - code: A.5.6
    title: "Contact with special interest groups"
    body: "The security team stays connected to industry forums and peer groups for warnings and advice."
  - code: A.5.7
    title: "Threat intelligence"
    body: "Threat information is gathered and turned into intelligence the team can act on."
  - code: A.5.8
    title: "Information security in project management"
    body: "Projects account for security from the start rather than at hand-off."
  - code: A.5.9
    title: "Inventory of information and other associated assets"
    body: "There is a current list of information and assets, and each entry has an owner."
  - code: A.5.10
    title: "Acceptable use of information and other associated assets"
    body: "Written rules say how information and equipment may be used and handled, and people follow them."
  - code: A.5.11
    title: "Return of assets"
    body: "Leavers and people changing roles hand back the organization's equipment and information."
  - code: A.5.12
    title: "Classification of information"
    body: "Information is sorted into sensitivity levels by what loss, tampering or outage would cost."
  - code: A.5.13
    title: "Labelling of information"
    body: "Labels show each item's sensitivity level, following the classification scheme."
  - code: A.5.14
    title: "Information transfer"
    body: "Moving information inside or outside the organization, by any channel, follows set rules and agreements."
  - code: A.5.15
    title: "Access control"
    body: "Who may reach which information and systems, physically or logically, is decided by written rules tied to business need."
  - code: A.5.16
    title: "Identity management"
    body: "Identities are created, maintained and retired under one managed lifecycle."
  - code: A.5.17
    title: "Authentication information"
    body: "Passwords, keys and other authenticators are issued and handled under a managed process, and users are told how to look after theirs."
  - code: A.5.18
    title: "Access rights"
    body: "Access is granted, checked, changed and withdrawn as the access policy says."
  - code: A.5.19
    title: "Information security in supplier relationships"
    body: "The security risk of relying on suppliers is identified and managed."
  - code: A.5.20
    title: "Addressing information security within supplier agreements"
    body: "Each supplier agreement states the security terms that suit that supplier."
  - code: A.5.21
    title: "Managing information security in the ICT supply chain"
    body: "Security risk in the technology supply chain is identified and managed."
  - code: A.5.22
    title: "Monitoring, review and change management of supplier services"
    body: "Supplier security and service quality are watched over time, and changes on their side are managed."
  - code: A.5.23
    title: "Information security for use of cloud services"
    body: "Taking on, running and leaving a cloud service each meet the organization's security needs."
  - code: A.5.24
    title: "Information security incident management planning and preparation"
    body: "Incident handling is planned ahead: process, roles and who to tell are settled before anything happens."
  - code: A.5.25
    title: "Assessment and decision on information security events"
    body: "Security events are triaged to decide which ones count as incidents."
  - code: A.5.26
    title: "Response to information security incidents"
    body: "Incidents are handled by following the written response procedure."
  - code: A.5.27
    title: "Learning from information security incidents"
    body: "Lessons from past incidents feed back into stronger controls."
  - code: A.5.28
    title: "Collection of evidence"
    body: "Evidence from security events is gathered and kept in a way that preserves its value."
  - code: A.5.29
    title: "Information security during disruption"
    body: "Security stays at an acceptable level while the business is disrupted."
  - code: A.5.30
    title: "ICT readiness for business continuity"
    body: "Technology needed for continuity is prepared and tested against recovery targets."
  - code: A.5.31
    title: "Legal, statutory, regulatory and contractual requirements"
    body: "Laws, regulations and contract terms that bear on security are tracked, along with how each is met."
  - code: A.5.32
    title: "Intellectual property rights"
    body: "The organization respects intellectual property rights, including software licensing."
  - code: A.5.33
    title: "Protection of records"
    body: "Business records are kept safe from loss, tampering and unauthorised disclosure."
  - code: A.5.34
    title: "Privacy and protection of personal identifiable information (PII)"
    body: "Personal data is protected as privacy law requires."
  - code: A.5.35
    title: "Independent review of information security"
    body: "Someone independent reviews the security program on a schedule and after major changes."
  - code: A.5.36
    title: "Compliance with policies, rules and standards for information security"
    body: "Compliance with security policies and standards is checked regularly."
  - code: A.5.37
    title: "Documented operating procedures"
    body: "Operating procedures for systems are written down and available to the people who run them."
  # ===== A.6 People controls =====
  - code: A.6.1
    title: "Screening"
    body: "Candidates are background-checked before they join and as appropriate afterwards, within the law and in proportion to the role."
  - code: A.6.2
    title: "Terms and conditions of employment"
    body: "Employment contracts spell out each side's security obligations."
  - code: A.6.3
    title: "Information security awareness, education and training"
    body: "Staff and relevant third parties get security awareness training suited to their role, and policy updates as they change."
  - code: A.6.4
    title: "Disciplinary process"
    body: "A known disciplinary process applies when someone breaks security policy."
  - code: A.6.5
    title: "Responsibilities after termination or change of employment"
    body: "Security obligations that outlast a departure or role change are defined and made known."
  - code: A.6.6
    title: "Confidentiality or non-disclosure agreements"
    body: "Confidentiality agreements fit the organization's protection needs, are kept current and are signed by the people they cover."
  - code: A.6.7
    title: "Remote working"
    body: "Remote work has its own safeguards for information handled off-site."
  - code: A.6.8
    title: "Information security event reporting"
    body: "Staff have a clear, fast way to report a suspected security event."
  # ===== A.7 Physical controls =====
  - code: A.7.1
    title: "Physical security perimeters"
    body: "Defined physical perimeters protect the areas holding information and equipment."
  - code: A.7.2
    title: "Physical entry"
    body: "Entry to secure areas is controlled."
  - code: A.7.3
    title: "Securing offices, rooms and facilities"
    body: "Offices, rooms and facilities are physically secured by design."
  - code: A.7.4
    title: "Physical security monitoring"
    body: "Premises are watched for unauthorised entry."
  - code: A.7.5
    title: "Protecting against physical and environmental threats"
    body: "Facilities are designed to withstand natural and man-made physical threats."
  - code: A.7.6
    title: "Working in secure areas"
    body: "Working inside secure areas follows its own security rules."
  - code: A.7.7
    title: "Clear desk and clear screen"
    body: "Desks are kept clear of papers and media, and unattended screens are locked."
  - code: A.7.8
    title: "Equipment siting and protection"
    body: "Equipment is placed and protected so it is hard to damage or tamper with."
  - code: A.7.9
    title: "Security of assets off-premises"
    body: "Assets used away from the premises are protected."
  - code: A.7.10
    title: "Storage media"
    body: "Storage media are controlled from purchase to disposal according to classification."
  - code: A.7.11
    title: "Supporting utilities"
    body: "Power and other utilities are protected so their failure does not take systems down."
  - code: A.7.12
    title: "Cabling security"
    body: "Power and network cabling is protected from tapping, interference and damage."
  - code: A.7.13
    title: "Equipment maintenance"
    body: "Equipment is serviced correctly so it keeps information available and intact."
  - code: A.7.14
    title: "Secure disposal or re-use of equipment"
    body: "Equipment with storage is checked to be wiped of sensitive data and licensed software before disposal or reuse."
  # ===== A.8 Technological controls =====
  - code: A.8.1
    title: "User endpoint devices"
    body: "Information on laptops, phones and other user devices is protected."
  - code: A.8.2
    title: "Privileged access rights"
    body: "Admin-level access is kept to the few who need it and tracked."
  - code: A.8.3
    title: "Information access restriction"
    body: "Access to information is limited as the access control policy sets out."
  - code: A.8.4
    title: "Access to source code"
    body: "Who can read or change source code, build tools and libraries is controlled."
  - code: A.8.5
    title: "Secure authentication"
    body: "Sign-in methods are strong enough for the sensitivity of what they protect."
  - code: A.8.6
    title: "Capacity management"
    body: "Resource use is watched and capacity adjusted ahead of demand."
  - code: A.8.7
    title: "Protection against malware"
    body: "Malware defences are in place, backed by user awareness."
  - code: A.8.8
    title: "Management of technical vulnerabilities"
    body: "Known technical weaknesses in systems in use are tracked, exposure is judged and fixes are applied."
  - code: A.8.9
    title: "Configuration management"
    body: "Secure configurations for hardware, software, services and networks are set, recorded and kept in check."
  - code: A.8.10
    title: "Information deletion"
    body: "Information that is no longer needed is deleted from systems and media."
  - code: A.8.11
    title: "Data masking"
    body: "Sensitive data is masked where policy, business need or law calls for it."
  - code: A.8.12
    title: "Data leakage prevention"
    body: "Measures stop sensitive information from leaking out of systems and networks."
  - code: A.8.13
    title: "Information backup"
    body: "Backups of data, software and systems are taken and restore-tested as the backup policy sets out."
  - code: A.8.14
    title: "Redundancy of information processing facilities"
    body: "Systems have enough redundancy to meet availability targets."
  - code: A.8.15
    title: "Logging"
    body: "Activity and error logs are kept, protected and reviewed."
  - code: A.8.16
    title: "Monitoring activities"
    body: "Networks, systems and applications are watched for abnormal behaviour, and suspicious findings are investigated."
  - code: A.8.17
    title: "Clock synchronization"
    body: "System clocks are synchronised to trusted time sources."
  - code: A.8.18
    title: "Use of privileged utility programs"
    body: "Powerful utilities that can bypass system controls are restricted."
  - code: A.8.19
    title: "Installation of software on operational systems"
    body: "Installing software on production systems is controlled."
  - code: A.8.20
    title: "Networks security"
    body: "Networks and network devices are secured and managed."
  - code: A.8.21
    title: "Security of network services"
    body: "Network services have defined security features and service levels, and both are monitored."
  - code: A.8.22
    title: "Segregation of networks"
    body: "Networks are segmented to keep groups of users, services and systems apart."
  - code: A.8.23
    title: "Web filtering"
    body: "Web access is filtered to cut exposure to malicious sites."
  - code: A.8.24
    title: "Use of cryptography"
    body: "Encryption use and key handling follow defined rules."
  - code: A.8.25
    title: "Secure development life cycle"
    body: "Software and systems are built under a secure development lifecycle."
  - code: A.8.26
    title: "Application security requirements"
    body: "Security requirements are written into the spec when building or buying applications."
  - code: A.8.27
    title: "Secure system architecture and engineering principles"
    body: "Secure engineering principles are documented and applied to system development."
  - code: A.8.28
    title: "Secure coding"
    body: "Code is written to secure coding standards."
  - code: A.8.29
    title: "Security testing in development and acceptance"
    body: "Security testing is a defined step in development."
  - code: A.8.30
    title: "Outsourced development"
    body: "Outsourced development is directed, monitored and reviewed."
  - code: A.8.31
    title: "Separation of development, test and production environments"
    body: "Development, test and production environments are kept apart and each is secured."
  - code: A.8.32
    title: "Change management"
    body: "Changes to systems and facilities go through change management."
  - code: A.8.33
    title: "Test information"
    body: "Test data is chosen carefully and protected."
  - code: A.8.34
    title: "Protection of information systems during audit testing"
    body: "Audit tests on live systems are planned and agreed with management to limit disruption."

