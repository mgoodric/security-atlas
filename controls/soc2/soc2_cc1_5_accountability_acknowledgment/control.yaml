bundle_schema_version: "1"
bundle_id: soc2_cc1_5_accountability_acknowledgment
title: "All personnel acknowledge core security policies"
description: |
  Each person answers for the control duties assigned to them (TSC CC1.5,
  COSO Principle 5). The intended test is that every active user has
  acknowledged the current version of each of the five core policies:
  Information Security, Access Control, Vendor Management, Incident
  Response and Change Management.

  What runs today: the query rolls up the connector's per-record verdicts:
  any fail fails the control, otherwise any pass passes it, and no
  in-window record leaves it inconclusive. The records are the tenant's
  `policy.acknowledgment.v1` acknowledgements (#2869), and each one is
  recorded as pass. The control therefore passes on any acknowledgement of
  any policy in the weekly window of 30 days. Which policies, which
  versions and which users are not checked.

  Pending: acknowledgements covering all five core policies in their
  current version (#2832); and every active user having acknowledged them,
  which needs a user inventory (#2834).

scf_anchor_id: HRS-02
control_family: HRS
implementation_type: automated
owner_role: hr
lifecycle_state: active
freshness_class: weekly

evidence_queries:
  - id: all_users_acknowledged_core_policies
    language: rego
    evidence_kind: policy.acknowledgment.v1
    description: "Every active user has acknowledged all 5 v1 stock policies in current version"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
