bundle_schema_version: "1"
bundle_id: soc2_cc6_2_new_user_provisioning
title: "New users authorized in HRIS before IdP provisioning"
description: |
  No one, staff or third party, gets credentials until they have been
  registered and approved (TSC CC6.2). The query reads the Okta user
  lifecycle stream and asserts every account creation in the period was
  preceded by an HRIS registration record — i.e. no user was provisioned
  to the IdP without a corresponding hire / contractor record.
  Manual-creation exceptions (consultants, break-glass) must be tagged
  with an approval ticket id in the lifecycle event metadata.

scf_anchor_id: IAC-04
control_family: IAC
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: every_provision_was_authorized
    language: rego
    evidence_kind: okta.user_lifecycle.v1
    description: "Every Okta user-create in the window has a matching HRIS record or approval ticket"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
