bundle_schema_version: "1"
bundle_id: soc2_cc6_2_new_user_provisioning
title: "New users authorized in HRIS before IdP provisioning"
description: |
  No one, staff or third party, gets credentials until they have been
  registered and approved (TSC CC6.2). The intended test is that every
  Okta account created in the period was preceded by an HRIS hire or
  contractor record, or carries an approval ticket id for a manual
  exception (consultants, break-glass).

  What runs today: the query rolls up the connector's per-record verdicts:
  any fail fails the control, otherwise any pass passes it, and no
  in-window record leaves it inconclusive. The records are the Okta
  connector's `okta.user_lifecycle.v1`, whose verdict is the user's status
  and MFA enrolment: an active user with MFA passes, an active user
  without MFA or a deprovisioned, suspended, locked-out or
  password-expired user fails, and a transitional status is inconclusive.
  Authorisation of the account is not checked.

  Pending: matching each provisioned account to an authorising hire
  record. There is no HRIS source yet; it needs a design (#2833).

scf_anchor_id: IAC-04
scf_release: test-2026.3
control_family: IAC
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: every_provision_was_authorized
    language: rego
    evidence_kind: okta.user_lifecycle.v1
    description: "Every Okta user-create in the window has a matching HRIS record or approval ticket"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
