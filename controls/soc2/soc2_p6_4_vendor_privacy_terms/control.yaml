bundle_schema_version: "1"
bundle_id: soc2_p6_4_vendor_privacy_terms
title: "Vendors handling personal information are bound by privacy terms"
description: |
  Vendors that handle personal information take on privacy duties by
  contract and are checked against them (TSC P6.4), including the duty to
  report any improper release they cause or discover (TSC P6.5). The owner
  uploads the data-processing-agreement register quarterly: each vendor,
  its signed terms, the breach-notice window it agreed to, and when it
  was last reviewed.

scf_anchor_id: PRI-14
scf_release: test-2026.3
control_family: PRI
implementation_type: semi_automated
owner_role: ciso
lifecycle_state: active
freshness_class: quarterly

evidence_queries:
  - id: dpa_register_uploaded_within_quarter
    language: rego
    evidence_kind: manual.upload.v1
    description: "A data-processing-agreement register upload exists within the last 120 days (quarterly plus 30-day grace)"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"

manual_evidence_schema:
  type: object
  required: [exported_at, vendors]
  properties:
    exported_at: { type: string, format: date-time }
    vendors:
      type: array
      items:
        type: object
        required:
          [vendor_name, dpa_signed_at, breach_notice_hours, last_reviewed_at]
        properties:
          vendor_name: { type: string }
          dpa_signed_at: { type: string, format: date }
          breach_notice_hours: { type: integer, minimum: 0 }
          last_reviewed_at: { type: string, format: date }
          dpa_uri: { type: string, format: uri }
