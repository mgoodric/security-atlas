bundle_schema_version: "1"
bundle_id: soc2_cc6_5_asset_disposal
title: "Decommissioned media and devices are securely wiped"
description: |
  Devices and media are wiped or destroyed before they leave the
  organisation's protection (TSC CC6.5). The owner uploads quarterly
  evidence of device disposal (laptops returned by terminated employees
  and wiped, storage media physically destroyed, EBS volumes deleted)
  including serial numbers, dates and disposal method. For cloud-native
  orgs the bulk of this evidence is the storage-deletion log from the
  cloud provider.

  What runs today: a SQL query over the `manual.upload.v1` records pushed
  to this control. The control passes when any upload, keyed by
  `filename`, has an `observed_at` within 90 days before the evaluation
  instant (`evaluated_at`). It fails when every upload is older than that,
  and no upload leaves it inconclusive. Records count for the quarterly
  window of 120 days, so an upload from 91 to 120 days ago fails the
  control and one older than that is not seen. The 90 days are counted as
  2,160 hours, so the bound does not move with daylight saving. An
  `observed_at` more than
  an hour after the evaluation instant is treated as unreadable, and
  records without a `filename` are left out. The record's `result`, which
  the manual connector writes as inconclusive for a person to judge, is
  not used.

  Not checked: what the upload contains. Any file pushed to this control
  counts as the disposal log; the serial numbers, dates and methods in
  the schema below are not read. `observed_at` is when the record was
  pushed, which is not always when the file was written.

scf_anchor_id: AST-22
scf_release: test-2026.3
control_family: AST
implementation_type: semi_automated
owner_role: it-operations
lifecycle_state: active
freshness_class: quarterly

evidence_queries:
  - id: disposal_log_uploaded_within_90d
    language: sql
    evidence_kind: manual.upload.v1
    description: "An upload pushed to this control has an observed_at within 90 days of the evaluation instant"
    expression: |
      SELECT CASE
               WHEN count(*) = 0 THEN 'inconclusive'
               WHEN bool_or(observed_at >= evaluated_at - interval '2160 hours'
                            AND observed_at <= evaluated_at + interval '1 hour') THEN 'pass'
               WHEN bool_or(observed_at > evaluated_at + interval '1 hour') THEN 'inconclusive'
               ELSE 'fail'
             END
      FROM evidence
      WHERE coalesce(payload->>'filename', '') <> ''

manual_evidence_schema:
  type: object
  required: [period_start, period_end, disposals]
  properties:
    period_start: { type: string, format: date }
    period_end: { type: string, format: date }
    disposals:
      type: array
      items:
        type: object
        required: [asset_id, asset_type, disposal_method, disposed_at]
        properties:
          asset_id:
            {
              type: string,
              description: "Serial / instance id / EBS volume id",
            }
          asset_type:
            {
              type: string,
              enum: [laptop, mobile, server, removable_media, cloud_volume],
            }
          disposal_method:
            {
              type: string,
              enum:
                [
                  crypto_erase,
                  physical_destruction,
                  cloud_delete,
                  secure_wipe_nist_888,
                ],
            }
          disposed_at: { type: string, format: date }
          witness:
            {
              type: string,
              description: "Email of witness (for physical destruction)",
            }
