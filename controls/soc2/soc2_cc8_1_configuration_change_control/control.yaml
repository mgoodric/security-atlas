bundle_schema_version: "1"
bundle_id: soc2_cc8_1_configuration_change_control
title: "Repositories require an approving review before merge"
description: |
  The configuration-change-control half of TSC CC8.1: infrastructure
  changes (Terraform, Kubernetes manifests, IAM policy JSON) are made only
  through reviewed pull requests on the IaC repositories. The intended
  test is that every repo tagged `iac` has branch protection with required
  reviews.

  What runs today: a SQL query over the payloads of the GitHub connector's
  `github.repo_protection.v1` records, one per repository's default branch
  per connector run. It takes each repository's latest in-window record
  (by `repo_full_name`) and passes the control when every one of them has
  `required_reviews` of at least 1. One repository whose latest record
  requires no approving review, or lacks the field, fails the control. No
  in-window record leaves it inconclusive. The connector's per-record
  verdict is not used.

  A repository with no branch protection is pushed with
  `required_reviews` 0, so it fails. A repository whose protection the
  connector could not read (any error other than 404) is also pushed with
  `required_reviews` 0, so it fails too, until the connector stops
  reporting unread fields as off.

  Pending, because the connector does not emit the field yet (#2827):
  limiting the check to repositories with the `iac` topic (the
  repository's `topics`). Until then every repository the connector reads
  counts, not only IaC ones. Only the records the control receives are
  checked: a repository that never reported is not seen, which waits on an
  inventory (#2834).

scf_anchor_id: CHG-03
control_family: CHG
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: every_repo_requires_approving_review
    language: sql
    evidence_kind: github.repo_protection.v1
    description: "Every repository's latest protection record requires at least one approving review"
    expression: |
      SELECT coalesce(bool_and(ok), false)
      FROM (
        SELECT DISTINCT ON (payload->>'repo_full_name') ok
        FROM (
          SELECT payload, observed_at,
                 coalesce(payload->>'repo_full_name' <> '', false)
                 AND CASE WHEN jsonb_typeof(payload->'required_reviews') = 'number'
                          THEN (payload->'required_reviews')::numeric >= 1
                          ELSE false
                     END AS ok
          FROM evidence
        ) AS checked
        ORDER BY payload->>'repo_full_name', observed_at DESC, ok
      ) AS latest
