bundle_schema_version: "1"
bundle_id: soc2_cc8_1_configuration_change_control
title: "Infrastructure changes go through reviewed pull requests"
description: |
  The configuration-change-control half of TSC CC8.1: infrastructure
  changes (Terraform, Kubernetes manifests, IAM policy JSON) are made only
  through reviewed pull requests on the IaC repositories. The intended
  test is that every repo tagged `iac` has branch protection with required
  reviews.

  What runs today: the query rolls up the connector's per-record verdicts:
  any fail fails the control, otherwise any pass passes it, and no
  in-window record leaves it inconclusive. The records are the GitHub
  connector's `github.repo_protection.v1`, one per repository's default
  branch, whose verdict is that at least one approving review is required:
  a branch requiring one passes, and a branch requiring none or having no
  protection fails. Every repository the connector reads counts, not only
  IaC ones.

  Pending: the approving-review check in SQL (#2823); and scoping to repos
  with the `iac` topic, which the connector does not emit yet (#2827).

scf_anchor_id: CHG-03
control_family: CHG
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: iac_repos_require_reviewed_prs
    language: rego
    evidence_kind: github.repo_protection.v1
    description: "IaC repos require reviewed PRs and have iac:true tag"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
