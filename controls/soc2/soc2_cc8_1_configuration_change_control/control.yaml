bundle_schema_version: "1"
bundle_id: soc2_cc8_1_configuration_change_control
title: "Repositories require an approving review before merge"
description: |
  The configuration-change-control half of TSC CC8.1: infrastructure
  changes (Terraform, Kubernetes manifests, IAM policy JSON) are made only
  through reviewed pull requests on the IaC repositories. The intended
  test is that every repo tagged `iac` has branch protection with required
  reviews.

  What runs today: a SQL query over the payloads of the GitHub connector's
  `github.repo_protection.v2` records, one per repository's default branch
  per connector run. The connector merges classic branch protection with
  every active repository and organization ruleset, so a branch protected
  only by a ruleset counts. The query takes each repository's latest
  in-window record, keyed by its stable `repo_id`, so a rename does not
  split one repository in two. It passes the control when every one of
  them has `required_reviews` of at least 1. One repository whose latest
  record requires no approving review fails it. So does a record with no
  usable `repo_id` or a mistyped field. A repository whose latest record
  omits `required_reviews`, because the connector could not read its
  protection, leaves the control inconclusive unless another repository
  fails it. No in-window v2 record leaves it inconclusive, including when
  only `github.repo_protection.v1` records arrived (a GitHub connector
  older than #2925): v1 records are not read. The connector's per-record
  verdict is not used.

  Pending, because the connector does not emit the field yet (#2827):
  limiting the check to repositories with the `iac` topic (the
  repository's `topics`). Until then every repository the connector reads
  counts, not only IaC ones. Only the records the control receives are
  checked: a repository that never reported is not seen, which waits on an
  inventory (#2834).

scf_anchor_id: CHG-03
control_family: CHG
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: every_repo_requires_approving_review
    language: sql
    evidence_kind: github.repo_protection.v2
    description: "Every repository's latest protection record requires at least one approving review"
    expression: |
      SELECT CASE
               WHEN count(*) = 0 THEN 'inconclusive'
               WHEN min(verdict) = 0 THEN 'fail'
               WHEN min(verdict) = 1 THEN 'inconclusive'
               ELSE 'pass'
             END
      FROM (
        SELECT DISTINCT ON (payload->'repo_id') verdict
        FROM (
          SELECT payload, observed_at,
                 CASE
                   WHEN coalesce(jsonb_typeof(payload->'repo_id'), '') <> 'number' THEN 0
                   WHEN (payload->'repo_id')::numeric < 1 THEN 0
                   WHEN payload->'required_reviews' IS NULL THEN 1
                   WHEN jsonb_typeof(payload->'required_reviews') <> 'number' THEN 0
                   WHEN (payload->'required_reviews')::numeric < 1 THEN 0
                   ELSE 2
                 END AS verdict
          FROM evidence
        ) AS checked
        ORDER BY payload->'repo_id', observed_at DESC, verdict
      ) AS latest
