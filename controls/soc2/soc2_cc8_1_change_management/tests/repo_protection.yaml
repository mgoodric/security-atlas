# github.repo_protection.v2 records, shaped as the GitHub connector emits
# them (connectors/github/cmd/atlas-github/cmd_run.go
# buildRepoProtectionRecord, #2925, 2.1.0 fields #2827). repo_id,
# repo_full_name and default_branch are always present, and topics plus
# deploys_to_production whenever the listing reports topics, even for an
# unread repo. A protection field the connector read is present; one it
# could not read is omitted, and that record is pushed inconclusive with a
# reason. A repo with no classic protection and no
# ruleset is pushed as fail with every field read and off. `result` is the
# connector's own verdict (required_reviews >= 1), which the query ignores.
cases:
  - name: every-repo-reviewed-and-admin-enforced-passes
    expected_state: pass
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: pass
        evidence_kind: github.repo_protection.v2
        observed_at: 2026-11-21T06:00:00Z
        payload:
          repo_id: 1296269
          repo_full_name: acme/api
          default_branch: main
          required_status_checks: [ci/build]
          allow_force_pushes: false
          topics: [production]
          deploys_to_production: true
          required_reviews: 1
          require_code_owner_reviews: false
          require_signed_commits: false
          require_linear_history: false
          enforce_admins: true
          protection_source: classic
      - result: pass
