# github.repo_protection.v1 records, shaped as the GitHub connector emits
# them (connectors/github/cmd/atlas-github/cmd_run.go
# buildRepoProtectionRecord): all seven fields are always present, and
# required_reviews is a JSON number. `result` is the connector's own
# verdict, required_reviews >= 1. A repo with no protection (404) is
# pushed as fail with every field zero or false; a repo whose protection
# could not be read is pushed as inconclusive with the same zeros.
cases:
  - name: every-repo-reviewed-and-admin-enforced-passes
    expected_state: pass
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: pass
        evidence_kind: github.repo_protection.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          repo_full_name: acme/api
          default_branch: main
          required_reviews: 1
          require_code_owner_reviews: false
          require_signed_commits: false
          require_linear_history: false
          enforce_admins: true
      - result: pass
        evidence_kind: github.repo_protection.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          repo_full_name: acme/infra
          default_branch: main
          required_reviews: 2
          require_code_owner_reviews: false
          require_signed_commits: false
          require_linear_history: false
          enforce_admins: true

  - name: admins-not-enforced-fails
    description: the connector passes this repo; protection does not bind admins
    expected_state: fail
    evaluated_at: 2026-11-21T12:00:00Z
