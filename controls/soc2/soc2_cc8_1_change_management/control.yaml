bundle_schema_version: "1"
bundle_id: soc2_cc8_1_change_management
title: "Production-deploying repositories enforce branch protection"
description: |
  Changes to infrastructure, data, software and procedures reach
  production only by a controlled, approved path (TSC CC8.1). The intended
  test is that every repository that deploys to production has branch
  protection on its production branch: required pull-request reviews,
  status checks, no force-push and protection enforced on admins.

  What runs today: the query rolls up the connector's per-record verdicts:
  any fail fails the control, otherwise any pass passes it, and no
  in-window record leaves it inconclusive. The records are the GitHub
  connector's `github.repo_protection.v1`, one per repository's default
  branch, whose verdict is that at least one approving review is required:
  a branch requiring one passes, and a branch requiring none or having no
  protection fails. Status checks, force-push, admin enforcement and which
  repos deploy to production are not checked.

  Pending: protection enforced on admins, in SQL over the record's
  existing fields (#2823); and required status checks, the force-push
  setting and the deploys-to-production topic, which the connector does
  not emit yet (#2827).

scf_anchor_id: CHG-02
control_family: CHG
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: prod_repos_have_branch_protection
    language: rego
    evidence_kind: github.repo_protection.v1
    description: "Every prod-deploying repo has protected main branch with PR reviews and status checks"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
