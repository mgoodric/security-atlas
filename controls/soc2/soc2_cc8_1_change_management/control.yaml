bundle_schema_version: "1"
bundle_id: soc2_cc8_1_change_management
title: "Production-deploying repositories enforce branch protection"
description: |
  Changes to infrastructure, data, software and procedures reach
  production only by a controlled, approved path (TSC CC8.1). For a SaaS
  codebase the testable manifestation is: every repository that deploys to
  production has GitHub branch protection enabled on the production branch
  — required pull-request reviews, status checks, no force-push, no direct
  push by non-admins.

scf_anchor_id: CHG-02
control_family: CHG
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: prod_repos_have_branch_protection
    language: rego
    evidence_kind: github.repo_protection.v1
    description: "Every prod-deploying repo has protected main branch with PR reviews and status checks"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
