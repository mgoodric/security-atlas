bundle_schema_version: "1"
bundle_id: soc2_cc8_1_change_management
title: "Repositories require an approving review, enforced on admins"
description: |
  Changes to infrastructure, data, software and procedures reach
  production only by a controlled, approved path (TSC CC8.1). The intended
  test is that every repository that deploys to production has branch
  protection on its production branch: required pull-request reviews,
  status checks, no force-push and protection enforced on admins.

  What runs today: a SQL query over the payloads of the GitHub connector's
  `github.repo_protection.v2` records, one per repository's default branch
  per connector run. The connector merges classic branch protection with
  every active repository and organization ruleset, so a branch protected
  only by a ruleset counts. The query takes each repository's latest
  in-window record, keyed by its stable `repo_id`, so a rename does not
  split one repository in two. It passes the control when every one of
  them has `required_reviews` of at least 1 and `enforce_admins` true.
  One repository whose latest record requires no approving review, or
  does not enforce the review on admins, fails it. So does a record with
  no usable `repo_id` or a mistyped field. A repository whose latest
  record omits either field, because the connector could not read it,
  leaves the control inconclusive unless another repository fails it. No
  in-window v2 record leaves it inconclusive, including when only
  `github.repo_protection.v1` records arrived (a GitHub connector older
  than #2925): v1 records are not read. The connector's per-record verdict
  is not used.

  The connector reports `enforce_admins` true when a source requiring a
  review binds admins: classic `enforce_admins`, or a ruleset that only an
  app or a deploy key may bypass. A role, team or user bypass actor may be
  an admin, so it counts as admin bypass.

  Pending, because the connector does not emit the fields yet (#2827):
  required status checks (the protection's required status checks
  contexts), force pushes blocked (`allow_force_pushes`), and limiting the
  check to repositories that deploy to production (a deploys-to-production
  topic or custom property). Until then every repository the connector
  reads counts. Only the records the control receives are checked: a
  repository that never reported is not seen, which waits on an inventory
  (#2834).

scf_anchor_id: CHG-02
control_family: CHG
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: every_repo_requires_review_enforced_on_admins
    language: sql
    evidence_kind: github.repo_protection.v2
    description: "Every repository's latest protection record requires an approving review and enforces it on admins"
    expression: |
      SELECT CASE
               WHEN count(*) = 0 THEN 'inconclusive'
               WHEN min(verdict) = 0 THEN 'fail'
               WHEN min(verdict) = 1 THEN 'inconclusive'
               ELSE 'pass'
             END
      FROM (
        SELECT DISTINCT ON (payload->'repo_id') verdict
        FROM (
          SELECT payload, observed_at,
                 CASE
                   WHEN coalesce(jsonb_typeof(payload->'repo_id'), '') <> 'number' THEN 0
                   WHEN (payload->'repo_id')::numeric < 1 THEN 0
                   WHEN payload->'required_reviews' IS NULL THEN 1
                   WHEN jsonb_typeof(payload->'required_reviews') <> 'number' THEN 0
                   WHEN (payload->'required_reviews')::numeric < 1 THEN 0
                   WHEN payload->'enforce_admins' IS NULL THEN 1
                   WHEN payload->'enforce_admins' <> 'true'::jsonb THEN 0
                   ELSE 2
                 END AS verdict
          FROM evidence
        ) AS checked
        ORDER BY payload->'repo_id', observed_at DESC, verdict
      ) AS latest
