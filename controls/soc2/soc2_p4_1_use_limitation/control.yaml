bundle_schema_version: "1"
bundle_id: soc2_p4_1_use_limitation
title: "Personal information is used only for its committed purposes"
description: |
  Personal information is put only to the uses the organisation
  committed to in its notice and contracts (TSC P4.1). The owner attests
  annually that every system processing personal information has been
  checked against the purposes on record, and that any new use went
  through a privacy review before launch.

scf_anchor_id: PRI-29
control_family: PRI
implementation_type: manual_attested
owner_role: ciso
lifecycle_state: active
freshness_class: annual

manual_evidence_schema:
  type: object
  required: [attested_at, attestor, systems_reviewed]
  properties:
    attested_at: { type: string, format: date-time }
    attestor: { type: string, minLength: 1 }
    systems_reviewed:
      type: array
      minItems: 1
      items:
        type: object
        required: [system_name, purposes, within_commitments]
        properties:
          system_name: { type: string }
          purposes: { type: array, items: { type: string } }
          within_commitments: { type: boolean }
          privacy_review_uri: { type: string, format: uri }
