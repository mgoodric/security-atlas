bundle_schema_version: "1"
bundle_id: soc2_p2_1_consent_records
title: "Data subject consent choices are captured and retained"
description: |
  Where personal information is handled on the basis of a person's choice,
  that choice is offered and the answer is kept (TSC P2.1). The owner
  attests annually to each processing purpose that relies on consent: how
  the choice is presented, where the consent record is stored, and how a
  withdrawal is honoured.

scf_anchor_id: PRI-24
control_family: PRI
implementation_type: manual_attested
owner_role: ciso
lifecycle_state: active
freshness_class: annual

manual_evidence_schema:
  type: object
  required: [attested_at, attestor, purposes]
  properties:
    attested_at: { type: string, format: date-time }
    attestor: { type: string, minLength: 1 }
    purposes:
      type: array
      minItems: 1
      items:
        type: object
        required: [purpose, consent_mechanism, record_location, withdrawal_path]
        properties:
          purpose: { type: string }
          consent_mechanism: { type: string }
          record_location: { type: string }
          withdrawal_path: { type: string }
