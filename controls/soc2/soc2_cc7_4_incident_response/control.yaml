bundle_schema_version: "1"
bundle_id: soc2_cc7_4_incident_response
title: "Incident response plan exists and incidents are logged"
description: |
  Confirmed incidents are handled by following a written response plan
  (TSC CC7.4). The control owner keeps on file (a) the current IR plan
  version, (b) a list of incidents declared in the period (zero is a valid
  count, but the listing itself is required evidence), and (c) for each
  declared incident, a link to the post-incident report or ticket showing
  the IR playbook was followed. The intended automated test is that
  everyone on call has acknowledged the IR plan.

  What runs today: a SQL query over the tenant's `policy.acknowledgment.v1`
  records in the quarterly window of 120 days, which only the
  acknowledgement handler writes (#2869, #2873). The control passes when
  at least one record acknowledges the policy titled "Incident Response
  Plan", read from the payload's `policy_title` (snapshotted at
  acknowledgement time, #2832), with `result` pass and an `observed_at`
  no more than an hour after the evaluation instant. Otherwise it is
  inconclusive. That includes no record at all, and records recorded
  before #2832, which carry no title.

  The check never fails. Received acknowledgements can show that someone
  acknowledged the plan, but not that someone who should have did not.
  Every on-call person having acknowledged the plan needs an on-call
  inventory (#2834). The title is matched exactly, so a renamed IR plan
  is not seen. The incident listing and post-incident reports are not
  evaluated.

scf_anchor_id: IRO-08
scf_release: test-2026.3
control_family: IRO
implementation_type: semi_automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: quarterly

evidence_queries:
  - id: ir_plan_acknowledged_by_on_call
    language: sql
    evidence_kind: policy.acknowledgment.v1
    description: "At least one in-window acknowledgement is of the Incident Response Plan"
    expression: |
      SELECT CASE
               WHEN bool_or(
                      jsonb_typeof(payload->'policy_title') = 'string'
                      AND payload->>'policy_title' = 'Incident Response Plan'
                      AND result = 'pass'
                      AND observed_at <= evaluated_at + interval '1 hour'
                    ) THEN 'pass'
               ELSE 'inconclusive'
             END
      FROM evidence

manual_evidence_schema:
  type: object
  required: [period_start, period_end, ir_plan_version, incidents]
  properties:
    period_start: { type: string, format: date }
    period_end: { type: string, format: date }
    ir_plan_version: { type: string }
    incidents:
      type: array
      items:
        type: object
        required: [incident_id, severity, declared_at, status, postmortem_uri]
        properties:
          incident_id: { type: string }
          severity: { type: string, enum: [sev0, sev1, sev2, sev3] }
          declared_at: { type: string, format: date-time }
          resolved_at: { type: string, format: date-time }
          status:
            {
              type: string,
              enum: [open, resolved, post_incident_review_pending],
            }
          postmortem_uri: { type: string, format: uri }
