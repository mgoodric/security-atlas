# policy.acknowledgment.v1 records, shaped as POST /v1/policies/{id}/acknowledge
# emits them (internal/api/policyacks/handlers.go): policy_id equals
# policy_version_id (each published version is its own policies row), result
# is always pass, observed_at is acknowledged_at, and since #2832 the payload
# carries the policy's policy_title and policy_version at acknowledgement time.
# A record without policy_title is one recorded before #2832.
cases:
  - name: ir-plan-acknowledged-passes
    expected_state: pass
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: pass
        evidence_kind: policy.acknowledgment.v1
        observed_at: 2026-11-20T09:00:00Z
        payload:
          policy_id: "c0000000-0000-0000-0000-000000000001"
          policy_version_id: "c0000000-0000-0000-0000-000000000001"
          user_id: "11111111-1111-1111-1111-111111111111"
          acknowledged_at: "2026-11-20T09:00:00Z"
          policy_title: "Incident Response Plan"
          policy_version: "1.0.0"

