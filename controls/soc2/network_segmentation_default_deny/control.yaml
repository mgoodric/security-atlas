bundle_schema_version: "1"
bundle_id: network_segmentation_default_deny
title: "Network segmentation: workloads isolated by default-deny network policy"
description: |
  Workloads are kept apart on the network, so that a compromised service
  cannot reach every other service by default. In Kubernetes, the measured
  form of that isolation is a namespace whose all-pods network policy (an
  empty pod selector, so no pod is left out) denies traffic unless a later
  rule allows it.

  The k8s connector reads every namespace's NetworkPolicy objects, plus
  Cilium and Calico policy CRDs where those CNIs are installed, and emits
  one k8s.networkpolicy_coverage.v1 record per namespace. A namespace
  passes when all-pods policies deny both ingress and egress by default.
  It fails when either direction is open: no policy at all, only per-pod
  allow rules, or default-deny in one direction only. A namespace whose
  read errored is inconclusive. Each record also carries the
  default_deny_ingress and default_deny_egress flags, so the open
  direction is visible. The query below fails the control when any
  in-window namespace fails.

  Crosswalk references: ISO/IEC 27001:2022 A.8.22 (segregation of
  networks) and PCI DSS 4.0 1.4.1 (network controls between trusted and
  untrusted networks), both on SCF NET-06; HIPAA 164.308(a)(4)(ii)(A)
  intersects. The bundled SOC 2 crosswalk maps no TSC criterion to NET-06,
  so this control adds no SOC 2 coverage.

  The connector's --netpol-control default is this control's bundle id,
  so its records link here on default flags. An explicit
  --netpol-control value overrides it.

scf_anchor_id: NET-06
control_family: NET
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: namespaces_enforce_default_deny_network_policy
    language: rego
    evidence_kind: k8s.networkpolicy_coverage.v1
    description: "Every assessed namespace enforces a default-deny all-pods network policy"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # namespace record, decided by the k8s connector against the default-deny
      # check the description above names. This rolls them up with the engine's
      # precedence (any fail, then any pass, then any inconclusive, else na;
      # empty ledger is inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
