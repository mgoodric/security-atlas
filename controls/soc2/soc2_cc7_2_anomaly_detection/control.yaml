bundle_schema_version: "1"
bundle_id: soc2_cc7_2_anomaly_detection
title: "Anomalous behavior detection is operational on production endpoints"
description: |
  Systems are watched for abnormal behaviour, whether it comes from an
  attack, a mistake or an outside event (TSC CC7.2). The intended test is
  that every managed endpoint has its EDR or behavioural detection engine
  installed, running and reporting healthy.

  What runs today: the query rolls up the connector's per-record verdicts:
  any fail fails the control, otherwise any pass passes it, and no
  in-window record leaves it inconclusive. The records are osquery's
  `osquery.host_posture.v1`, whose verdict is disk encryption plus screen
  lock on each host, not EDR: a host passes when both are on, fails when
  either is off, and is inconclusive when its posture could not be read.

  Pending: whether EDR is installed, running and healthy, which osquery
  does not emit yet (#2826).

scf_anchor_id: MON-16
control_family: MON
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: edr_running_on_every_managed_endpoint
    language: rego
    evidence_kind: osquery.host_posture.v1
    description: "Every managed endpoint has EDR / anomaly detection engine running"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
