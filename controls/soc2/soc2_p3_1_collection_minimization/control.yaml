bundle_schema_version: "1"
bundle_id: soc2_p3_1_collection_minimization
title: "Personal information collected is limited to documented purposes"
description: |
  Each place the service gathers personal information is listed with the
  purpose that justifies each field, so nothing is collected beyond what a
  stated purpose needs (TSC P3.1). The owner attests annually that the
  collection inventory is current and that every collected category has a
  documented purpose and legal basis.

scf_anchor_id: PRI-31
control_family: PRI
implementation_type: manual_attested
owner_role: product-engineering
lifecycle_state: active
freshness_class: annual

manual_evidence_schema:
  type: object
  required: [attested_at, attestor, collection_points]
  properties:
    attested_at: { type: string, format: date-time }
    attestor: { type: string, minLength: 1 }
    collection_points:
      type: array
      minItems: 1
      items:
        type: object
        required: [name, data_categories, purpose, legal_basis]
        properties:
          name: { type: string }
          data_categories: { type: array, items: { type: string } }
          purpose: { type: string }
          legal_basis: { type: string }
