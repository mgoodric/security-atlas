bundle_schema_version: "1"
bundle_id: soc2_cc4_1_continuous_monitoring
title: "Endpoint posture is continuously monitored via osquery / Fleet"
description: |
  Controls are checked, both continuously and at set intervals, to confirm
  they exist and work (TSC CC4.1). The intended test is that every managed
  endpoint has reported its osquery / Fleet posture within the last 24
  hours.

  What runs today: the query rolls up the connector's per-record verdicts:
  any fail fails the control, otherwise any pass passes it, and no
  in-window record leaves it inconclusive. The records are osquery's
  `osquery.host_posture.v1`, whose verdict is disk encryption plus screen
  lock on each host: a host passes when both are on, fails when either is
  off, and is inconclusive when its posture could not be read. Records
  count for the daily window of 7 days. How recently each host reported is
  not checked.

  Pending: every host seen reporting within 24 hours, from `observed_at`
  (#2822); and every managed endpoint reporting, which needs an endpoint
  inventory (#2834).

scf_anchor_id: MON-02
control_family: MON
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: every_endpoint_reported_in_24h
    language: rego
    evidence_kind: osquery.host_posture.v1
    description: "Every managed endpoint has a posture record observed within 24h"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
