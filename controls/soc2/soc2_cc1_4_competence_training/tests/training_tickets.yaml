# jira.ticket_evidence.v1 records, shaped as the Jira connector emits them
# at schema 1.1.0 (connectors/jira/cmd/atlas-jira/cmd_run.go
# buildJiraTicketRecord, #2829): ticket_key and status always; labels,
# assignee_account_id, resolution and resolved_at only when Jira has a
# value. observed_at is the connector run. `result` is the connector's
# status verdict, which the query ignores.
#
# Every case pins evaluated_at 2026-11-21T12:00:00Z; 8,760 hours before it
# is 2025-11-21T12:00:00Z. Cases without a training_completion record
# leave that query inconclusive, so the control's state is the ticket
# query's.
cases:
  - name: every-assignee-current-passes
    description: one assignee at the inclusive 365-day boundary; an unlabelled open ticket is left out
    expected_state: pass
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: pass
        evidence_kind: jira.ticket_evidence.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          {
            ticket_key: SEC-1,
            status: Done,
            resolution: Done,
            assignee: Mia,
            assignee_account_id: acct-mia,
            labels: [security-training, fy26],
            resolved_at: "2026-03-01T10:00:00Z",
          }
      - result: pass
        evidence_kind: jira.ticket_evidence.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          {
            ticket_key: SEC-2,
            status: Done,
            resolution: Done,
            assignee: Emma,
            assignee_account_id: acct-emma,
            labels: [security-training],
            resolved_at: "2025-11-21T12:00:00Z",
          }
      - result: inconclusive
        evidence_kind: jira.ticket_evidence.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          {
            ticket_key: CR-9,
            status: In Progress,
            assignee_account_id: acct-noah,
            labels: [change],
          }

  - name: resolved-just-over-365d-fails
    expected_state: fail
    evaluated_at: 2026-11-21T12:00:00Z
