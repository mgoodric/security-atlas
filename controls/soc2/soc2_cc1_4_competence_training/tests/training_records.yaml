# security_awareness.training_completion.v1 records, shaped as the platform
# builds them (internal/securityawareness/store.go BuildCompletionEvidence):
# one per completed assignment, `observed_at` equal to `completed_at`,
# `result` always pass, which the query ignores. The registered schema
# (1.0.0) enumerates completion_source as manual, csv or lms_connector; a
# tenant-private schema of the same kind and version can widen that, so the
# query checks it too. Every case pins `evaluated_at`: 365 days before
# 2026-11-21T12:00:00Z is 2025-11-21T12:00:00Z, and the annual window
# reaches back 400 days.
#
# The control also has a Rego roll-up over jira.ticket_evidence.v1. With no
# Jira record that query is inconclusive, so the control's state is the
# training query's pass or fail; two cases carry a Jira record to show the
# combination.
cases:
  - name: every-person-current-from-allowed-source-passes
    expected_state: pass
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: pass
        evidence_kind: security_awareness.training_completion.v1
        observed_at: 2026-02-10T09:30:00Z
        payload:
          assignment_id: 9a1c2b3d-0000-4000-8000-000000000001
          campaign_id: 7f000000-0000-4000-8000-000000000001
          campaign_name: FY26 annual security awareness
          course_code: SAT-101
          course_title: Security awareness fundamentals
          person_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
          completed_at: 2026-02-10T09:30:00Z
          completion_source: lms_connector
      - result: pass
        evidence_kind: security_awareness.training_completion.v1
        observed_at: 2026-06-01T14:00:00Z
        payload:
          assignment_id: 9a1c2b3d-0000-4000-8000-000000000002
          campaign_id: 7f000000-0000-4000-8000-000000000001
          campaign_name: FY26 annual security awareness
          course_code: SAT-101
          course_title: Security awareness fundamentals
          person_id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
          completed_at: 2026-06-01T14:00:00.123456Z
          completion_source: csv

