bundle_schema_version: "1"
bundle_id: soc2_cc1_4_competence_training
title: "All personnel complete annual security awareness training"
description: |
  People doing security-relevant work are hired for it, trained in it and
  kept capable of it (TSC CC1.4, COSO Principle 4). The intended test is
  that every employee and contractor completes security awareness training
  on hire and at least annually.

  What runs today: two queries, each rolling up the verdicts of its own
  evidence kind (any fail fails, otherwise any pass passes, no record is
  inconclusive), and the control combines them the same way. On
  `jira.ticket_evidence.v1` the Jira connector's verdict is the ticket's
  status: Done, Resolved, Closed, Cancelled or Completed passes, any other
  status is inconclusive. Labels, assignee and resolution date are not
  checked, so any ticket the connector's JQL returns counts. On
  `security_awareness.training_completion.v1` every record is written as
  pass when a completion is recorded. Records count for the annual window
  of 400 days.

  Pending: completions within 365 days from an allowed source (manual,
  csv, lms_connector) (#2824); the Jira ticket's `security-training`
  label, resolution and date (#2829); and every active user holding a
  current completion, which needs a user inventory (#2834).

scf_anchor_id: SAT-04
control_family: SAT
implementation_type: automated
owner_role: hr
lifecycle_state: active
freshness_class: annual

evidence_queries:
  - id: training_completion_within_365d
    language: rego
    evidence_kind: jira.ticket_evidence.v1
    description: "Every active user has a closed security-training ticket within 400 days (annual plus 35-day grace)"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
  - id: training_completion_records_within_365d
    language: rego
    evidence_kind: security_awareness.training_completion.v1
    description: "Every assigned security-awareness training completion is current within 400 days (annual plus 35-day grace)"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
