bundle_schema_version: "1"
bundle_id: soc2_cc1_4_competence_training
title: "All personnel complete annual security awareness training"
description: |
  People doing security-relevant work are hired for it, trained in it and
  kept capable of it (TSC CC1.4, COSO Principle 4). Operationally for SOC
  2 the auditor-tested manifestation is: every employee and contractor
  completes annual security awareness training within their required
  cadence (on hire + within 12 months thereafter). The control is
  automated by inspecting completion tickets — each training assignment is
  filed as a Jira ticket tagged `security-training`, and the evidence
  query asserts every active user has an open or closed completion ticket
  within the last 365 days.

scf_anchor_id: HRS-04
control_family: HRS
implementation_type: automated
owner_role: hr
lifecycle_state: active
freshness_class: monthly

evidence_queries:
  - id: training_completion_within_365d
    language: rego
    evidence_kind: jira.ticket_evidence.v1
    description: "Every active user has a closed security-training ticket within 365 days"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
  - id: training_completion_records_within_365d
    language: rego
    evidence_kind: security_awareness.training_completion.v1
    description: "Every assigned security-awareness training completion is current within 365 days"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
