# osquery.host_posture.v1 records, shaped as the osquery connector emits
# them (connectors/osquery/cmd/atlas-osquery/cmd_run.go
# buildHostPostureRecord): all four booleans are always present. `result`
# is the connector's own verdict, disk encryption plus screen lock. The
# query decides on `firewall_enabled`, so a record can pass here and fail
# there, or the reverse.
cases:
  - name: every-host-firewall-on-passes
    expected_state: pass
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: pass
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          host_uuid: 11111111-1111-1111-1111-111111111111
          hostname: alice-mbp
          platform: darwin
          disk_encryption_enabled: true
          screen_lock_enabled: true
          firewall_enabled: true
          mdm_enrolled: true
      - result: fail
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          host_uuid: 22222222-2222-2222-2222-222222222222
          hostname: bob-thinkpad
          platform: linux
          disk_encryption_enabled: false
          screen_lock_enabled: true
          firewall_enabled: true
          mdm_enrolled: false

  - name: one-host-firewall-off-fails
    description: the connector's verdict passes this host; the firewall is off
    expected_state: fail
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: pass
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          host_uuid: 11111111-1111-1111-1111-111111111111
          hostname: alice-mbp
          platform: darwin
          disk_encryption_enabled: true
          screen_lock_enabled: true
          firewall_enabled: true
          mdm_enrolled: true
      - result: pass
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          host_uuid: 33333333-3333-3333-3333-333333333333
          hostname: carol-surface
          platform: windows
          disk_encryption_enabled: true
          screen_lock_enabled: true
          firewall_enabled: false
          mdm_enrolled: true

  - name: unread-host-counts-as-firewall-off
    description: a failed Fleet detail fetch is pushed inconclusive with firewall_enabled false
    expected_state: fail
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: inconclusive
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          host_uuid: 44444444-4444-4444-4444-444444444444
          hostname: dave-mbp
          platform: darwin
          disk_encryption_enabled: false
          screen_lock_enabled: false
          firewall_enabled: false
          mdm_enrolled: false

  - name: missing-firewall-field-fails
    expected_state: fail
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: pass
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          host_uuid: 55555555-5555-5555-5555-555555555555
          hostname: erin-mbp

  - name: latest-record-per-host-decides-on
    description: the firewall was turned on after an earlier in-window record had it off
    expected_state: pass
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: pass
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T01:00:00Z
        payload:
          host_uuid: 33333333-3333-3333-3333-333333333333
          hostname: carol-surface
          firewall_enabled: false
      - result: pass
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T09:00:00Z
        payload:
          host_uuid: 33333333-3333-3333-3333-333333333333
          hostname: carol-surface
          firewall_enabled: true

  - name: latest-record-per-host-decides-off
    description: the firewall was turned off after an earlier in-window record had it on
    expected_state: fail
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: pass
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T01:00:00Z
        payload:
          host_uuid: 33333333-3333-3333-3333-333333333333
          hostname: carol-surface
          firewall_enabled: true
      - result: pass
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T09:00:00Z
        payload:
          host_uuid: 33333333-3333-3333-3333-333333333333
          hostname: carol-surface
          firewall_enabled: false

  - name: no-record-is-inconclusive
    expected_state: inconclusive
    evaluated_at: 2026-11-21T12:00:00Z
