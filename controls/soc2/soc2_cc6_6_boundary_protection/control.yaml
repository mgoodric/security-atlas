bundle_schema_version: "1"
bundle_id: soc2_cc6_6_boundary_protection
title: "Production endpoints have host-firewall enabled"
description: |
  Systems are shielded from threats that originate outside the system
  boundary (TSC CC6.6). Network boundary protection covers many controls;
  the auditor-most-tested manifestation at endpoint level is: every
  production-developer endpoint has a host firewall enabled (pf on macOS,
  ufw on Linux, Windows Defender Firewall on Windows). The osquery query
  reads the firewall-state table and asserts coverage.

scf_anchor_id: NET-04
control_family: NET
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: host_firewall_enabled_on_managed_endpoints
    language: rego
    evidence_kind: osquery.host_posture.v1
    description: "Every managed endpoint reports host firewall = enabled"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
