bundle_schema_version: "1"
bundle_id: soc2_pi1_2_input_completeness
title: "Input validation is exercised by SAST and contract tests"
description: |
  Inputs are checked so that only complete, accurate data enters
  processing (TSC PI1.2). The intended test is that every in-scope repo's
  most recent SAST scan has zero unsuppressed findings in the
  input-validation rule set (injection, deserialisation and
  schema-violation patterns).

  What runs today: a SQL query over the payloads of `sast.scan_result.v1`
  records at schema 1.1.0, one per scan. No bundled connector emits that
  kind: the pusher (a CI job running `atlas-cli evidence push`, or the
  adopter's own scanner) sends each scan with its `repository` and its
  `findings`, each finding with a `severity`, a `rule_id` and whether it
  is `suppressed`. The query takes each repository's latest in-window
  scan, keyed by `repository`; scans without a `repository` are left out.
  That scan may have no unsuppressed finding whose `rule_id` is one of
  the four input-validation rules: `injection.sql`, `injection.command`,
  `deserialization.unsafe` and `input.schema_violation`. These are
  platform rule ids, so the pusher maps its scanner's rules onto them; a
  finding under any other rule id is not read. A finding counts as
  suppressed only when `suppressed` is true.

  One repository whose latest scan has an unsuppressed input-validation
  finding fails the control, whatever the other repositories report. A
  scan with no `findings` array (a 1.0.0 record, or a pusher that sent
  only `findings_count`) leaves the control inconclusive unless another
  repository fails it, and so does an unsuppressed finding with no
  string `rule_id`. An empty `findings` array is a clean scan. With no
  scan that names a repository, the control is inconclusive. When two
  scans of one repository tie on `observed_at`, the worse verdict
  decides. The pusher's per-record verdict is not used.

  Not checked: contract tests, and whether the scanner's rule set
  actually covers these patterns; a scanner that cannot find a SQL
  injection reports none. How a finding came to be suppressed is not
  read. Scan age is bounded only by the daily window of 7 days, so a
  repository whose scans stop drops out after that. Only the scans the
  control receives are checked: every in-scope repo scanned needs a repo
  inventory (#2834).

scf_anchor_id: TDA-05
control_family: TDA
implementation_type: automated
owner_role: product-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: input_validation_taint_rules_clean
    language: sql
    evidence_kind: sast.scan_result.v1
    description: "Each repository's latest SAST scan has no unsuppressed finding under the input-validation rules"
    expression: |
      SELECT CASE
               WHEN count(*) = 0 THEN 'inconclusive'
               WHEN min(verdict) = 0 THEN 'fail'
               WHEN min(verdict) = 1 THEN 'inconclusive'
               ELSE 'pass'
             END
      FROM (
        SELECT repo, min(verdict) AS verdict
        FROM (
          SELECT repo,
                 CASE
                   WHEN jsonb_typeof(findings) IS DISTINCT FROM 'array' THEN 1
                   ELSE (
                     SELECT coalesce(min(
                              CASE
                                WHEN jsonb_typeof(finding) IS DISTINCT FROM 'object' THEN 1
                                WHEN finding->'suppressed' = 'true'::jsonb THEN 2
                                WHEN jsonb_typeof(finding->'rule_id') IS DISTINCT FROM 'string' THEN 1
                                -- Each rule id is written as two concatenated halves: the static
                                -- guard reads any dotted word as a schema-qualified name
                                WHEN finding->>'rule_id' IN ('injection' || '.sql',
                                                             'injection' || '.command',
                                                             'deserialization' || '.unsafe',
                                                             'input' || '.schema_violation') THEN 0
                                ELSE 2
                              END), 2)
                     FROM jsonb_array_elements(
                            CASE WHEN jsonb_typeof(findings) = 'array' THEN findings ELSE '[]'::jsonb END
                          ) AS f(finding)
                   )
                 END AS verdict,
                 rank() OVER (PARTITION BY repo ORDER BY observed_at DESC) AS recency
          FROM (
            SELECT payload->>'repository' AS repo,
                   observed_at,
                   payload->'findings' AS findings
            FROM evidence
            WHERE jsonb_typeof(payload->'repository') = 'string'
              AND payload->>'repository' <> ''
          ) AS keyed
        ) AS ranked
        WHERE recency = 1
        GROUP BY repo
      ) AS per_repo
