bundle_schema_version: "1"
bundle_id: soc2_pi1_2_input_completeness
title: "Input validation is exercised by SAST and contract tests"
description: |
  Inputs are checked so that only complete, accurate data enters
  processing (TSC PI1.2). The intended test is that every in-scope repo's
  most recent SAST scan has zero unsuppressed findings in the
  input-validation rule set (injection, deserialisation and
  schema-violation patterns).

  What runs today: the query rolls up the connector's per-record verdicts:
  any fail fails the control, otherwise any pass passes it, and no
  in-window record leaves it inconclusive. The records are
  `sast.scan_result.v1`. No bundled connector emits that kind; the verdict
  is whatever the pusher (for example `atlas-cli evidence push --result`)
  states. Findings and rule sets are not checked.

  Pending: findings with severity, rule id and suppression in a new
  `sast.scan_result` schema version, to select the input-validation rules
  (#2831).

scf_anchor_id: TDA-05
control_family: TDA
implementation_type: automated
owner_role: product-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: input_validation_taint_rules_clean
    language: rego
    evidence_kind: sast.scan_result.v1
    description: "SAST scans show zero unsuppressed input-validation findings"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
