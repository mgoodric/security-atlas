# sast.scan_result.v1 records at schema 1.1.0 (#2831): one per scan, with
# the repository scanned and every finding as {rule_id, severity,
# suppressed}. No bundled connector emits the kind; a pusher sends it
# through `atlas-cli evidence push`. `result` is the pusher's own verdict,
# which the query ignores, so most cases set it to the opposite of the
# expected state.
#
# The input-validation rules are injection.sql, injection.command,
# deserialization.unsafe and input.schema_violation, matched exactly.
cases:
  - name: no-input-validation-finding-passes
    description: other rules' findings, and a suppressed input-validation finding, do not fail
    expected_state: pass
    evaluated_at: 2026-11-22T12:00:00Z
    records:
      - result: fail
        evidence_kind: sast.scan_result.v1
        observed_at: 2026-11-22T06:00:00Z
        payload:
          {
            tool: semgrep,
            findings_count: 3,
            repository: acme/api,
            findings:
              [
                {
                  rule_id: injection.sql,
                  severity: critical,
                  suppressed: true,
                },
                { rule_id: authz.idor, severity: high, suppressed: false },
                {
                  rule_id: go.tls.skip_verify,
                  severity: critical,
                  suppressed: false,
                },
              ],
          }
      - result: fail
        evidence_kind: sast.scan_result.v1
        observed_at: 2026-11-22T06:00:00Z
        payload:
          {
            tool: semgrep,
            findings_count: 0,
            repository: acme/web,
            findings: [],
          }

  - name: unsuppressed-injection-sql-fails
