      - result: pass
        evidence_kind: aws.s3.bucket_encryption_state.v1
        observed_at: 2026-11-21T14:00:00Z
        payload:
          bucket_name: acme-logs
          encryption_enabled: true
          sse_algorithm: AES256
          bucket_key_enabled: false
          account_id: "111122223333"
          region: us-east-1

  - name: record-without-bucket-name-is-left-out
    expected_state: inconclusive
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: fail
        evidence_kind: aws.s3.bucket_encryption_state.v1
        observed_at: 2026-11-21T06:00:00Z
