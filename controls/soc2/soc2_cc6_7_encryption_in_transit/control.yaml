bundle_schema_version: "1"
bundle_id: soc2_cc6_7_encryption_in_transit
title: "Data is encrypted in transit; storage encryption-at-rest enforced"
description: |
  Data moves, and leaves, only by approved paths and to approved
  recipients (TSC CC6.7). The auditor-tested manifestation has two prongs:
  (a) encryption in transit (TLS-only public endpoints) and (b)
  encryption-at-rest enforcement on data-bearing stores. This bundle
  covers prong (b) with AWS S3 bucket encryption; prong (a) is covered by
  deployment-level controls outside this bundle (load balancer and CDN
  config). NOTE: this scoping is a judgment call; see the review log for
  the alternative.

  What runs today: a SQL query over the payloads of the AWS connector's
  `aws.s3.bucket_encryption_state.v1` records, one per bucket per
  connector run. It takes each bucket's latest in-window record, keyed by
  `bucket_name` and ordered by `observed_at`. A bucket passes when that
  record's `result` is pass, `encryption_enabled` is true and
  `sse_algorithm` is `AES256` (SSE-S3) or `aws:kms` (SSE-KMS). A bucket
  fails when the connector observed no default encryption rule (`result`
  fail with `encryption_enabled` false), or when its default rule names
  any other algorithm (`aws:kms:dsse`, `aws:fsx`, `aws:backup`, or a value
  AWS adds later). Any failing bucket fails the control. Otherwise the
  control passes only when every bucket passes, and is inconclusive when
  any bucket is unread: the connector could not read its region or
  encryption (`result` inconclusive), the rule's algorithm is missing, or
  the latest record's `observed_at` is more than an hour after the
  evaluation instant. No in-window record also leaves it inconclusive.

  Why `result` is read and not `encryption_enabled` alone: schema 1.0.0
  requires `encryption_enabled`, so the connector writes it false on an
  inconclusive record too, meaning "not observed" (#2815). A false
  `encryption_enabled` fails a bucket only when the connector's verdict
  is fail, which it gives only for AWS's
  `ServerSideEncryptionConfigurationNotFoundError` or a configuration
  with no default rule.

  Records without a `bucket_name` are left out. When a bucket's latest
  records tie on `observed_at` (the connector truncates it to the hour),
  the bucket passes only if every tied record passes, and any tied
  failing record fails it.

  Not checked: which KMS key is used, whether it is customer-managed, or
  the bucket policy (a deny on unencrypted uploads). Only the buckets the
  connector reported are checked: a bucket in an account the connector
  does not read is not seen, which waits on an inventory (#2834).

scf_anchor_id: CRY-05
control_family: CRY
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: all_s3_buckets_encrypted_at_rest
    language: sql
    evidence_kind: aws.s3.bucket_encryption_state.v1
    description: "Every bucket's latest record shows default encryption with AES256 or aws:kms"
    expression: |
      SELECT CASE
               WHEN count(*) = 0 THEN 'inconclusive'
               WHEN bool_or(any_bad) THEN 'fail'
               WHEN bool_and(all_ok) THEN 'pass'
               ELSE 'inconclusive'
             END
      FROM (
        SELECT bucket,
               bool_or(coalesce(
                 readable AND (
                   (result = 'fail' AND enc = 'false'::jsonb)
                   OR (enc = 'true'::jsonb AND alg <> '' AND alg NOT IN ('AES256', 'aws:kms'))
                 ), false)) AS any_bad,
               bool_and(coalesce(
                 readable AND result = 'pass' AND enc = 'true'::jsonb
                   AND alg IN ('AES256', 'aws:kms'), false)) AS all_ok
        FROM (
          SELECT payload->>'bucket_name' AS bucket,
                 result,
                 payload->'encryption_enabled' AS enc,
                 CASE
                   WHEN jsonb_typeof(payload->'sse_algorithm') = 'string'
                     THEN payload->>'sse_algorithm'
                 END AS alg,
                 observed_at <= evaluated_at + interval '1 hour' AS readable,
                 rank() OVER (
                   PARTITION BY payload->>'bucket_name'
                   ORDER BY observed_at DESC
                 ) AS recency
          FROM evidence
          WHERE coalesce(payload->>'bucket_name', '') <> ''
        ) AS ranked
        WHERE recency = 1
        GROUP BY bucket
      ) AS per_bucket
