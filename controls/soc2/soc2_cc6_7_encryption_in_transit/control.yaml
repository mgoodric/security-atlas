bundle_schema_version: "1"
bundle_id: soc2_cc6_7_encryption_in_transit
title: "Data is encrypted in transit; storage encryption-at-rest enforced"
description: |
  Data moves, and leaves, only by approved paths and to approved
  recipients (TSC CC6.7). The auditor-tested manifestation has two prongs:
  (a) encryption in transit (TLS-only public endpoints) and (b)
  encryption-at-rest enforcement on data-bearing stores. This bundle
  covers prong (b) with AWS S3 bucket encryption; prong (a) is covered by
  deployment-level controls outside this bundle (load balancer and CDN
  config). NOTE: this scoping is a judgment call; see the review log for
  the alternative.

  What runs today: the query rolls up the connector's per-record verdicts:
  any fail fails the control, otherwise any pass passes it, and no
  in-window record leaves it inconclusive. The records are the AWS
  connector's `aws.s3.bucket_encryption_state.v1`, whose verdict is that
  the bucket has a default server-side encryption rule: a bucket with one
  passes, a bucket without one fails, and a bucket whose region or
  encryption could not be read is inconclusive. The algorithm is not
  checked.

  Pending: default encryption with an allowed algorithm (AES256, aws:kms),
  in SQL over the record's existing fields (#2825).

scf_anchor_id: CRY-05
control_family: CRY
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: all_s3_buckets_encrypted_at_rest
    language: rego
    evidence_kind: aws.s3.bucket_encryption_state.v1
    description: "Every S3 bucket has default encryption enabled with SSE-S3 or SSE-KMS"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
