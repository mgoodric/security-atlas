bundle_schema_version: "1"
bundle_id: soc2_a1_1_capacity_monitoring
title: "Production endpoints reporting performance posture"
description: |
  Production capacity is tracked against demand so headroom can be added
  before load outgrows it (TSC A1.1).

  What runs today: the query rolls up the connector's per-record verdicts:
  any fail fails the control, otherwise any pass passes it, and no
  in-window record leaves it inconclusive. The records are osquery's
  `osquery.host_posture.v1`, whose verdict is disk encryption plus screen
  lock on each host, not capacity: a host passes when both are on, fails
  when either is off, and is inconclusive when its posture could not be
  read. `hourly` is not in the engine's freshness table, so records stay
  in window for the 90-day fallback.

  Pending: the capacity check itself, every production host below 85%
  disk, 90% memory and 90% p95 CPU on its latest sample. osquery does not
  emit utilisation or host role yet (#2826).

scf_anchor_id: MON-02
control_family: MON
implementation_type: automated
owner_role: it-operations
lifecycle_state: active
freshness_class: hourly

evidence_queries:
  - id: production_capacity_healthy
    language: rego
    evidence_kind: osquery.host_posture.v1
    description: "Every production host reports capacity headroom on the most recent sample"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
