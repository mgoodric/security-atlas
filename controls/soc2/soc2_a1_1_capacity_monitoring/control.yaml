bundle_schema_version: "1"
bundle_id: soc2_a1_1_capacity_monitoring
title: "Production endpoints reporting posture have capacity headroom"
description: |
  Production capacity is tracked against demand so headroom can be added
  before load outgrows it (TSC A1.1). The test is that every production
  host is under 85% disk use, under 90% memory use and under 90% CPU at
  the 5-minute p95.

  What runs today: a SQL query over the payloads of osquery's
  `osquery.host_posture.v1` records, one per host per connector run. It
  takes each host's latest in-window record, keyed by `host_uuid` and
  ordered by the host's own `last_seen_at`, then by the record's
  `observed_at`. Only hosts whose latest record has `host_role`
  `production` count. A production host fails when its
  `disk_used_percent` is 85 or more, its `memory_used_percent` 90 or
  more, or its `cpu_p95_5m_percent` 90 or more; any failing production
  host fails the control. The control passes only when every production
  host has all three readings and all three are under their bounds. It is
  inconclusive when any production host is missing a reading, when no
  host is production, or when there is no in-window record. A reading that
  is present but not a number counts as over. The connector's per-record
  verdict, which is disk encryption plus screen lock, is not used.

  What the osquery connector supplies: `disk_used_percent` from Fleet's
  `percent_disk_space_available`, and `host_role` `production` when the
  host carries the Fleet label the operator names with
  `--production-label` (`host_role_source` names it). Fleet's host API
  has no memory-use or CPU-use field, so the connector never emits
  `memory_used_percent` or `cpu_p95_5m_percent`. On a Fleet-only tenant
  this control therefore fails on disk use or is inconclusive; it cannot
  pass until another pusher supplies memory and CPU (#2935). Records
  before schema 1.3.0 carry none of these fields, so their hosts are not
  production.

  Records without a `host_uuid` are left out. When a host's latest
  records tie on both times, the host is production if any tied record
  says so, fails if any tied record is over a bound, and passes only if
  every tied record has all three readings under.

  Not checked: hosts not labelled production, capacity trends or
  forecasts, and anything but the latest reading. Only the records the
  control receives are checked: a production host that never reported is
  not seen, which waits on an endpoint inventory (#2834).

scf_anchor_id: MON-02
control_family: MON
implementation_type: automated
owner_role: it-operations
lifecycle_state: active
freshness_class: realtime

evidence_queries:
  - id: production_capacity_healthy
    language: sql
    evidence_kind: osquery.host_posture.v1
    description: "Every production host's latest posture record is under 85% disk, 90% memory and 90% p95 CPU"
    expression: |
      SELECT CASE
               WHEN count(*) = 0 THEN 'inconclusive'
               WHEN bool_or(host_state = 'fail') THEN 'fail'
               WHEN bool_and(host_state = 'pass') THEN 'pass'
               ELSE 'inconclusive'
             END
      FROM (
        SELECT host,
               CASE
                 WHEN bool_or(disk = 'over' OR mem = 'over' OR cpu = 'over') THEN 'fail'
                 WHEN bool_and(disk = 'ok' AND mem = 'ok' AND cpu = 'ok') THEN 'pass'
                 ELSE 'unread'
               END AS host_state
        FROM (
          SELECT host, role,
                 CASE
                   WHEN d IS NULL THEN 'unread'
                   WHEN jsonb_typeof(d) = 'number' AND d::numeric < 85 THEN 'ok'
                   ELSE 'over'
                 END AS disk,
                 CASE
                   WHEN m IS NULL THEN 'unread'
                   WHEN jsonb_typeof(m) = 'number' AND m::numeric < 90 THEN 'ok'
                   ELSE 'over'
                 END AS mem,
                 CASE
                   WHEN c IS NULL THEN 'unread'
                   WHEN jsonb_typeof(c) = 'number' AND c::numeric < 90 THEN 'ok'
                   ELSE 'over'
                 END AS cpu
          FROM (
            SELECT payload->>'host_uuid' AS host,
                   payload->>'host_role' AS role,
                   payload->'disk_used_percent' AS d,
                   payload->'memory_used_percent' AS m,
                   payload->'cpu_p95_5m_percent' AS c,
                   rank() OVER (
                     PARTITION BY payload->>'host_uuid'
                     ORDER BY CASE
                                WHEN payload->>'last_seen_at' ~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$'
                                     AND pg_input_is_valid(payload->>'last_seen_at', 'timestamptz')
                                  THEN CASE
                                         WHEN (payload->>'last_seen_at')::timestamptz <= evaluated_at + interval '1 hour'
                                           THEN (payload->>'last_seen_at')::timestamptz
                                       END
                              END DESC NULLS LAST,
                              observed_at DESC
                   ) AS recency
            FROM evidence
            WHERE coalesce(payload->>'host_uuid', '') <> ''
          ) AS ranked
          WHERE recency = 1
        ) AS latest
        GROUP BY host
        HAVING bool_or(role = 'production')
      ) AS per_host
