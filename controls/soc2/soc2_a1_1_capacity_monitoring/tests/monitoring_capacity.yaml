# monitoring.host_capacity.v1 records at schema 1.0.0, shaped as the Datadog
# connector emits them (connectors/datadog/internal/hostcapacity/record.go
# Build, #2935): one per host in --capacity-production-scope, so host_role is
# always production; a reading is present only when it was read. `result` is
# always inconclusive, which the query ignores. The connector's readings are
# built from Datadog's documented metrics query response, not from a live
# tenant (connectors/datadog/internal/hostcapacity/testdata/README.md).
#
# The control rolls its two queries up as any fail, then any pass. Cases
# with no osquery.host_posture.v1 record leave that query inconclusive, so
# the control's state is this query's. The last four cases combine both.
cases:
  - name: datadog-every-host-under-passes
    expected_state: pass
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: inconclusive
        evidence_kind: monitoring.host_capacity.v1
        observed_at: 2026-11-21T12:00:00Z
        payload:
          source_vendor: datadog
          host_name: web-1
          host_role: production
          host_role_source: datadog_scope:env:production
          window_start: 2026-11-21T11:55:00Z
          window_end: 2026-11-21T12:00:00Z
          cpu_sample_count: 20
          memory_used_percent: 60
          cpu_p95_5m_percent: 76
          disk_used_percent: 80
      - result: inconclusive
        evidence_kind: monitoring.host_capacity.v1
        observed_at: 2026-11-21T12:00:00Z
        payload:
          source_vendor: datadog
          host_name: web-2
          host_role: production
          host_role_source: datadog_scope:env:production
          window_start: 2026-11-21T11:55:00Z
          window_end: 2026-11-21T12:00:00Z
          cpu_sample_count: 20
          memory_used_percent: 89.99
          cpu_p95_5m_percent: 89.99
          disk_used_percent: 84.99

