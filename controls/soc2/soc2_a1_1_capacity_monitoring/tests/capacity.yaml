# osquery.host_posture.v1 records at schema 1.3.0, shaped as the osquery
# connector emits them (connectors/osquery/cmd/atlas-osquery/cmd_run.go
# buildHostPostureRecord) plus the memory_used_percent and
# cpu_p95_5m_percent another pusher would add: a field is present only when
# it was read. `result` is the connector's own verdict, disk encryption plus
# screen lock, which the query ignores.
cases:
  - name: every-production-host-under-passes
    description: a non-production host over every bound is not counted
    expected_state: pass
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: fail
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          host_uuid: 11111111-1111-1111-1111-111111111111
          hostname: api-1
          platform: linux
          host_role: production
          host_role_source: fleet_label:Production
          disk_used_percent: 40
          memory_used_percent: 50
          cpu_p95_5m_percent: 20
      - result: inconclusive
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          host_uuid: 22222222-2222-2222-2222-222222222222
          hostname: api-2
          platform: linux
          host_role: production
          host_role_source: fleet_label:Production
          disk_used_percent: 84.9
          memory_used_percent: 89.9
          cpu_p95_5m_percent: 89.9
      - result: inconclusive
        evidence_kind: osquery.host_posture.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          host_uuid: 33333333-3333-3333-3333-333333333333
          hostname: build-1
          platform: linux
          disk_used_percent: 99
          memory_used_percent: 99
          cpu_p95_5m_percent: 99

