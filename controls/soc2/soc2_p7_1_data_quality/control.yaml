bundle_schema_version: "1"
bundle_id: soc2_p7_1_data_quality
title: "Personal information is kept accurate, complete and current"
description: |
  Personal information is kept correct, complete and current enough for
  the purpose it serves (TSC P7.1). The owner attests annually to how each
  system holding personal information validates it at entry, lets people
  update it, and corrects records found to be wrong.

scf_anchor_id: PRI-35
control_family: PRI
implementation_type: manual_attested
owner_role: product-engineering
lifecycle_state: active
freshness_class: annual

manual_evidence_schema:
  type: object
  required: [attested_at, attestor, systems]
  properties:
    attested_at: { type: string, format: date-time }
    attestor: { type: string, minLength: 1 }
    systems:
      type: array
      minItems: 1
      items:
        type: object
        required: [system_name, entry_validation, self_service_update]
        properties:
          system_name: { type: string }
          entry_validation: { type: boolean }
          self_service_update: { type: boolean }
          correction_process: { type: string }
