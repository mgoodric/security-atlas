bundle_schema_version: "1"
bundle_id: soc2_cc6_6_mfa_external_threats
title: "MFA enforced on all internet-facing administrative interfaces"
description: |
  The canonical external-threat authentication control under TSC CC6.6 is
  MFA on every internet-facing administrative interface. The intended
  test, deliberately narrower than CC6.1's MFA everywhere because auditors
  sample admin paths first, is that every Okta app classified admin or
  infrastructure enforces MFA at sign-in.

  What runs today: a SQL query over the payloads of the Okta connector's
  `okta.app_assignment.v1` records, one per app per connector run. It
  takes each app's latest in-window record, keyed by `app_id`; records
  without an `app_id` are left out. An ACTIVE app whose `classification`
  is `admin` or `infrastructure` must have `sign_on_mfa_required` true.
  The operator classifies apps on the connector (`--admin-apps`,
  `--infrastructure-apps`, lists of Okta app ids), and every other app is
  then `standard`, which the query skips, as it skips an app that is not
  ACTIVE.

  An app requires MFA when either of two policies does, and the record
  says which. `sign_on_mfa_required` is the app's own app sign-in policy
  (the policy its `_links.accessPolicy` names): true when every active
  rule denies access or allows it with an assurance method whose factor
  mode is 2FA, or with an authentication method chain whose every path
  takes factors of two classes (knowledge, possession, or a possession
  factor that demands a PIN or biometric); false when any active rule
  allows 1FA or a single-class chain path, whatever that rule's
  conditions. `session_mfa_required` is the org's global session policy,
  which every sign-in passes before any app: true when every reachable
  active rule denies access or requires a factor, false when a reachable
  rule allows a session without one. A rule after a catch-all rule of the
  same policy is unreachable, and so is every policy after one whose only
  condition includes the Everyone group, with no group or user excluded,
  and that has an active catch-all rule; any other rule counts as
  reachable.

  One admin or infrastructure app for which both say false fails the
  control, whatever the other apps report, and so does a mistyped field.
  An app for which neither says true and one is omitted (no app sign-in
  policy, as in a Classic Engine org; an identity-proofing rule, or a
  chain using an authenticator whose factor class depends on its set-up,
  such as Duo or an external IdP; policies the connector could not read;
  a record from a connector older than #2951, which does not read the
  global session policy) leaves the control inconclusive unless another
  app fails it. An app with no `classification` (the operator
  classified no app, or a 1.0.0 record from a connector older than #2828)
  may be admin: it passes only if it requires MFA, and is otherwise
  inconclusive. With no app in scope, the control is inconclusive. When
  two records for one app tie on `observed_at`, the worse verdict decides.
  The connector's per-record verdict is not used.

  Not checked: group membership. The global session verdict is for the
  whole org, so a reachable rule that lets some users establish a session
  with one factor counts against every app, even one those users are not
  assigned to; requiring 2FA in that app's own sign-in policy passes it.
  How long a factor is remembered (`factorPromptMode`, `reauthenticateIn`)
  is not read. Whether an app is internet-facing is not read; the
  operator's classification stands in for it. Only the records the control receives
  are checked: an app the connector did not report is not seen.

scf_anchor_id: IAC-37
scf_release: test-2026.3
control_family: IAC
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: mfa_enforced_on_admin_apps
    language: sql
    evidence_kind: okta.app_assignment.v1
    description: "Every active admin or infrastructure Okta app's latest record shows its app sign-in policy or the global session policy requires MFA"
    expression: |
      SELECT CASE
               WHEN count(*) FILTER (WHERE in_scope) = 0 THEN 'inconclusive'
               WHEN min(verdict) = 0 THEN 'fail'
               WHEN min(verdict) = 1 THEN 'inconclusive'
               ELSE 'pass'
             END
      FROM (
        SELECT app, min(verdict) AS verdict, bool_or(in_scope) AS in_scope
        FROM (
          SELECT app,
                 in_scope,
                 CASE
                   WHEN NOT in_scope THEN 2
                   WHEN class IS NULL THEN greatest(mfa, 1)
                   WHEN class IN ('"admin"'::jsonb, '"infrastructure"'::jsonb) THEN mfa
                   ELSE 0
                 END AS verdict,
                 rank() OVER (PARTITION BY app ORDER BY observed_at DESC) AS recency
          FROM (
            SELECT payload->>'app_id' AS app,
                   observed_at,
                   payload->'classification' AS class,
                   coalesce(payload->>'status' = 'ACTIVE', false)
                     AND payload->'classification' IS DISTINCT FROM '"standard"'::jsonb AS in_scope,
                   CASE
                     WHEN payload->'sign_on_mfa_required' IS NOT NULL
                          AND jsonb_typeof(payload->'sign_on_mfa_required') <> 'boolean' THEN 0
                     WHEN payload->'session_mfa_required' IS NOT NULL
                          AND jsonb_typeof(payload->'session_mfa_required') <> 'boolean' THEN 0
                     WHEN payload->'sign_on_mfa_required' = 'true'::jsonb
                          OR payload->'session_mfa_required' = 'true'::jsonb THEN 2
                     WHEN payload->'sign_on_mfa_required' IS NULL
                          OR payload->'session_mfa_required' IS NULL THEN 1
                     ELSE 0
                   END AS mfa
            FROM evidence
            WHERE jsonb_typeof(payload->'app_id') = 'string'
              AND payload->>'app_id' <> ''
          ) AS checked
        ) AS ranked
        WHERE recency = 1
        GROUP BY app
      ) AS per_app
