bundle_schema_version: "1"
bundle_id: soc2_cc6_6_mfa_external_threats
title: "MFA enforced on all internet-facing administrative interfaces"
description: |
  The canonical external-threat authentication control under TSC CC6.6 is
  MFA on every internet-facing administrative interface. The intended
  test, deliberately narrower than CC6.1's MFA everywhere because auditors
  sample admin paths first, is that every Okta app classified admin or
  infrastructure enforces MFA at sign-in.

  What runs today: the query rolls up the connector's per-record verdicts:
  any fail fails the control, otherwise any pass passes it, and no
  in-window record leaves it inconclusive. The records are the Okta
  connector's `okta.app_assignment.v1`, which it emits as inconclusive by
  design, leaving the decision to the platform. This control is therefore
  inconclusive whatever the assignments contain.

  Pending: the app's classification and whether its sign-on policy
  requires MFA, which the connector does not emit yet (#2828).

scf_anchor_id: IAC-37
control_family: IAC
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: mfa_enforced_on_admin_apps
    language: rego
    evidence_kind: okta.app_assignment.v1
    description: "Every admin/infrastructure app has MFA required at sign-in"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
