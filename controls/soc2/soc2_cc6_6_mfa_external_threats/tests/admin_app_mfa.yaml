# okta.app_assignment.v1 records, shaped as the Okta connector emits them
# at schema 1.1.0 (connectors/okta/cmd/atlas-okta/cmd_run.go
# buildAppAssignmentRecord, #2828). app_id, app_name, status and
# assigned_group_ids are always present. classification is present once
# the operator classified any app (--admin-apps, --infrastructure-apps);
# sign_on_policy_id when the app names an app sign-in policy; and
# sign_on_mfa_required when the connector could decide it, otherwise
# reason says why. `result` is always inconclusive: the connector leaves
# the decision to the platform, and the query ignores it.
cases:
  - name: admin-and-infrastructure-apps-require-mfa-passes
    description: a standard app on a 1FA policy is out of scope
    expected_state: pass
    evaluated_at: 2026-11-21T12:00:00Z
    records:
      - result: inconclusive
        evidence_kind: okta.app_assignment.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          {
            app_id: 0oa1admin,
            app_name: Okta Admin Console,
            status: ACTIVE,
            assigned_group_ids: [00g1admins],
            assigned_group_count: 1,
            classification: admin,
            sign_on_policy_id: rst1admin,
            sign_on_mfa_required: true,
          }
      - result: inconclusive
        evidence_kind: okta.app_assignment.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          {
            app_id: 0oa2aws,
            app_name: AWS,
            status: ACTIVE,
            assigned_group_ids: [00g1eng],
            assigned_group_count: 1,
            classification: infrastructure,
            sign_on_policy_id: rst1admin,
            sign_on_mfa_required: true,
          }
      - result: inconclusive
        evidence_kind: okta.app_assignment.v1
        observed_at: 2026-11-21T06:00:00Z
        payload:
          {
            app_id: 0oa3slack,
            app_name: Slack,
