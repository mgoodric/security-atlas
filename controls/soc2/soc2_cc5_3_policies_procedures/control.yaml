bundle_schema_version: "1"
bundle_id: soc2_cc5_3_policies_procedures
title: "Core security policies acknowledged in current version"
description: |
  Expectations are set in written policy and carried out through
  documented procedures (TSC CC5.3). Operationally this resolves to: the
  v1 policy library is current (each policy has been reviewed within its
  review cadence), and active users have acknowledged the current version.
  The evidence query reads the `policy.acknowledgment` ledger and asserts
  the population of acknowledgments matches active users for each policy.

scf_anchor_id: GOV-01
control_family: GOV
implementation_type: automated
owner_role: ciso
lifecycle_state: active
freshness_class: weekly

evidence_queries:
  - id: current_policy_versions_acknowledged
    language: rego
    evidence_kind: policy.acknowledgment.v1
    description: "Every active user has acknowledged the current version of each in-scope policy"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
