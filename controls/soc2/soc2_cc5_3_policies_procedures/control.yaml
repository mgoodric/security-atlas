bundle_schema_version: "1"
bundle_id: soc2_cc5_3_policies_procedures
title: "Core security policies acknowledged in current version"
description: |
  Expectations are set in written policy and carried out through
  documented procedures (TSC CC5.3). The intended test is that each policy
  in the library is within its review cadence and every active user has
  acknowledged the version in force.

  What runs today: the query rolls up the connector's per-record verdicts:
  any fail fails the control, otherwise any pass passes it, and no
  in-window record leaves it inconclusive. The records are the tenant's
  `policy.acknowledgment.v1` acknowledgements (#2869), and each one is
  recorded as pass. The control therefore passes on any acknowledgement of
  any policy in the weekly window of 30 days. Policy versions, review
  dates and users are not checked.

  Pending: acknowledgements referencing the policy version in force
  (#2832); and every active user having acknowledged it, which needs a
  user inventory (#2834).

scf_anchor_id: GOV-02
control_family: GOV
implementation_type: automated
owner_role: ciso
lifecycle_state: active
freshness_class: weekly

evidence_queries:
  - id: current_policy_versions_acknowledged
    language: rego
    evidence_kind: policy.acknowledgment.v1
    description: "Every active user has acknowledged the current version of each in-scope policy"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
