# sast.scan_result.v1 records at schema 1.1.0 (#2831): one per scan, with
# the repository scanned and every finding as {rule_id, severity,
# suppressed}. No bundled connector emits the kind; a pusher sends it
# through `atlas-cli evidence push`. `result` is the pusher's own verdict,
# which the query ignores, so most cases set it to the opposite of the
# expected state.
#
# The authorisation rules are authz.missing_check, authz.idor,
# authz.privilege_escalation and authz.broken_object_level, matched exactly.
cases:
  - name: no-authorization-finding-passes
    description: other rules' findings, and a suppressed authorisation finding, do not fail
    expected_state: pass
    evaluated_at: 2026-11-22T12:00:00Z
    records:
      - result: fail
        evidence_kind: sast.scan_result.v1
        observed_at: 2026-11-22T06:00:00Z
        payload:
          {
            tool: semgrep,
            findings_count: 3,
            repository: acme/api,
            findings:
              [
                { rule_id: authz.idor, severity: critical, suppressed: true },
                { rule_id: injection.sql, severity: high, suppressed: false },
                {
                  rule_id: go.tls.skip_verify,
                  severity: critical,
                  suppressed: false,
                },
              ],
          }
      - result: fail
        evidence_kind: sast.scan_result.v1
        observed_at: 2026-11-22T06:00:00Z
        payload:
          {
            tool: semgrep,
            findings_count: 0,
            repository: acme/web,
            findings: [],
          }

