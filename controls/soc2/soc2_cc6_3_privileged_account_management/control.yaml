bundle_schema_version: "1"
bundle_id: soc2_cc6_3_privileged_account_management
title: "Privileged credentials vaulted with break-glass workflow"
description: |
  Privileged accounts are a tested subset of CC6.3 (granting, changing and
  revoking access). The query reads the 1Password org-policy snapshot and
  asserts that the vault containing privileged credentials (root keys,
  shared admin passwords, break-glass accounts) has: a documented list of
  vault members, sharing-disabled-by-default, and an audit-event stream
  enabled. Personal-vault sharing of company secrets is disallowed.

scf_anchor_id: IAC-10
control_family: IAC
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: privileged_vault_locked_down
    language: rego
    evidence_kind: 1password.org_policy.v1
    description: "Privileged vault has restricted membership, sharing-disabled-by-default, audit logging on"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
