bundle_schema_version: "1"
bundle_id: soc2_cc6_1_logical_access_baseline
title: "Identity provider requires phishing-resistant MFA for everyone"
description: |
  Access to protected systems and data goes through managed logical access
  controls (TSC CC6.1). The test is that the identity provider has an MFA
  policy that requires MFA, applies to the everyone group, and allows a
  phishing-resistant factor.

  What runs today: a SQL query over the payloads of the Okta connector's
  `okta.mfa_policy.v1` snapshots, one per MFA enrollment policy. It takes
  each policy's latest in-window snapshot and passes the control when at
  least one of them has `mfa_required` true, lists `everyone` (in any
  case) in `applies_to_groups`, and lists `webauthn` in `factors_allowed`.
  Otherwise the control fails: MFA not required, a policy scoped to other
  groups only, or only SMS, voice, email, OTP or push factors. No in-window
  snapshot leaves it inconclusive. The connector's per-record verdict is
  not used.

  Until #2901 lands, this fails on real Okta tenants: the connector reports
  group ids, not `everyone`, and doesn't emit `webauthn`.

  Not checked: Okta Verify with number matching also resists phishing, but
  the snapshot records only the factor key (`okta_verify`), not whether
  number matching is on, so `okta_verify` does not count. An inactive
  policy counts the same as an active one. A higher-priority policy scoped
  to a subset of users can override the Everyone policy for them, and that
  is not seen. Only the records the control receives are checked; a policy
  the connector did not report is not seen.

scf_anchor_id: IAC-01
control_family: IAC
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: mfa_policy_everyone_phishing_resistant
    language: sql
    evidence_kind: okta.mfa_policy.v1
    description: "An Okta MFA policy requires MFA, applies to everyone, and allows WebAuthn"
    expression: |
      SELECT coalesce(bool_or(
               payload->'mfa_required' = 'true'::jsonb
               AND payload->'factors_allowed' ? 'webauthn'
               AND EXISTS (
                 SELECT 1
                 FROM jsonb_array_elements_text(
                   CASE WHEN jsonb_typeof(payload->'applies_to_groups') = 'array'
                        THEN payload->'applies_to_groups'
                        ELSE '[]'::jsonb
                   END
                 ) AS grp(group_name)
                 WHERE lower(group_name) = 'everyone'
               )
             ), false)
      FROM (
        SELECT DISTINCT ON (payload->>'policy_id') payload
        FROM evidence
        ORDER BY payload->>'policy_id', observed_at DESC
      ) AS latest
