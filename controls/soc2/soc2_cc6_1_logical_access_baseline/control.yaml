bundle_schema_version: "1"
bundle_id: soc2_cc6_1_logical_access_baseline
title: "Identity provider enforces MFA on all org-managed applications"
description: |
  Access to protected systems and data goes through managed logical access
  controls (TSC CC6.1). The canonical operationalisation is: the corporate
  identity provider (Okta / Google Workspace / Azure AD) is the chokepoint
  for application access and enforces MFA on every assigned application.
  The query reads the Okta MFA policy snapshot and asserts the policy is
  enabled, applies to the everyone group, and requires a
  phishing-resistant factor (WebAuthn, push-with-number-matching) for at
  least admin roles.

scf_anchor_id: IAC-01
control_family: IAC
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: daily

evidence_queries:
  - id: idp_mfa_policy_enabled
    language: rego
    evidence_kind: okta.mfa_policy.v1
    description: "Okta MFA policy is enabled, applies broadly, requires a phishing-resistant factor for admins"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
