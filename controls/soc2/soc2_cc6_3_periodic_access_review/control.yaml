bundle_schema_version: "1"
bundle_id: soc2_cc6_3_periodic_access_review
title: "Quarterly access review completed for in-scope systems"
description: |
  Regular review of accounts and their privileges covers the
  change-and-revoke side of TSC CC6.3. The query reads the
  `access_review.completion` ledger and asserts each in-scope system has a
  completed review record within the last 90 days (i.e. quarterly
  cadence). The reviewer and remediation actions are captured in the
  evidence record.

scf_anchor_id: IAC-12
control_family: IAC
implementation_type: automated
owner_role: security-engineering
lifecycle_state: active
freshness_class: quarterly

evidence_queries:
  - id: every_in_scope_system_reviewed_in_90d
    language: rego
    evidence_kind: access_review.completion.v1
    description: "Every in-scope system has a completed access review within 90 days"
    expression: |
      package evidence.query

      # The sandbox input is {records: [{result}]}: one verdict per in-window
      # record, decided by the connector that emitted it against the check the
      # description above names. This rolls them up with the engine's precedence
      # (any fail, then any pass, then any inconclusive, else na; empty ledger is
      # inconclusive). See internal/eval/rego.go.

      result := "fail" if {
        some r in input.records
        r.result == "fail"
      } else := "pass" if {
        some r in input.records
        r.result == "pass"
      } else := "inconclusive" if {
        some r in input.records
        r.result == "inconclusive"
      } else := "na" if {
        count(input.records) > 0
      } else := "inconclusive"
